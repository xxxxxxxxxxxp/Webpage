<style>
:root{--bg:#f5f4ef;--paper:#fff;--ink:#203c33;--muted:#738078;--line:#dce2da;--green:#315b48;--lime:#dbe8ab;--serif:Georgia,'Times New Roman',serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;font-size:14px}button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #a58235;outline-offset:4px}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#edf0e7;border-right:1px solid var(--line);padding:34px 24px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;margin-bottom:48px}.seal{display:grid;place-items:center;width:38px;height:44px;border:1px solid var(--green);border-radius:4px 4px 18px 18px;font-family:var(--serif);font-size:25px}.brand strong{font:23px var(--serif)}.brand small{display:block;font-size:9px;letter-spacing:3px;margin-top:4px}.nav-label,.eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}nav{display:grid;gap:7px;margin-top:17px}nav a{padding:13px 12px;border-radius:6px;display:flex;gap:12px;align-items:center;font-size:13px}nav a.active{background:var(--green);color:white}nav a:hover:not(.active){background:#e0e6d9}.nav-icon{width:20px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:22px;font-size:12px;color:var(--muted);line-height:1.7}.side-bottom strong{color:var(--ink)}.main{min-width:0}.topbar{height:81px;padding:0 44px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fafaf7}.topbar span{font-size:12px;color:var(--muted)}.profile-link{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:33px;height:33px;border-radius:50%;display:grid;place-items:center @media(max-width:720px){.layout{display:block}.sidebar{position:relative;height:auto;padding:18px}.brand{margin-bottom:16px}.nav-label,.side-bottom{display:none}nav{display:flex;overflow:auto;margin:0;gap:4px}nav a{white-space:nowrap;padding:10px;font-size:11px}.nav-icon{display:none}.topbar{height:60px;padding:0 20px}.content{padding:27px 20px}.heading{align-items:start}h1{font-size:34px}.heading>.pill{display:none}.hero{grid-template-columns:1fr;padding:27px}.hero h2{font-size:30px}.hero-art{display:none}.stats{grid-template-columns:repeat(2,1fr);margin-bottom:28px}.grid{grid-template-columns:1fr}.section-head h2{font-size:23px}footer{line-height:1.7}.panel{padding:20px}}
</style>
<style>
.role-switch{display:flex;align-items:center;gap:12px}.role-badge{font-size:10px!important;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--green)!important}.admin-panel{border-left:4px solid #a58235}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-grid .full{grid-column:1/-1}.field{display:grid;gap:7px}.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;padding:12px;color:var(--ink);border-radius:4px}.field textarea{min-height:110px;resize:vertical}.stack{display:grid;gap:18px}.book-level{display:inline-block;background:var(--lime);padding:5px 8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}.submission{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.book-card{display:flex;flex-direction:column;gap:14px}.book-card .card-footer{margin-top:auto}.notice strong{color:var(--ink)}

<script>
const defaultSchools=[
{id:'fitness',name:'School of Fitness',description:'Explore movement, physical training, and lifelong wellbeing.',symbol:'↗',color:''},
{id:'media',name:'School of Media and Arts',description:'Explore visual storytelling, creative expression, and the world of media.',symbol:'◈',color:'rose'},
{id:'performing',name:'School of Performing Arts',description:'Discover expression through music, theatre, dance, and performance.',symbol:'♫',color:'gold'},
{id:'languages',name:'School of Languages and Communication',description:'Build connections through languages, writing, and effective communication.',symbol:'Aa',color:'blue'},
{id:'computing',name:'School of Computer Science',description:'Explore computation, software, and the ideas behind digital systems.',symbol:'{ }',color:''},
{id:'mathematics',name:'School of Mathematics',description:'Discover patterns, logical reasoning, and the mathematics of our world.',symbol:'∑',color:'gold'},
{id:'biology',name:'School of Biology and Biomedical Sciences',description:'Understand living systems, from ecosystems to human biology and biomedical discovery.',symbol:'⌬',color:'blue'},
{id:'engineering',name:'School of Engineering and Robotics',description:'Design, build, and explore machines, robots, and practical solutions.',symbol:'⚙',color:'rose'},
{id:'humanities',name:'School of the Humanities',description:'Explore the ideas, stories, and questions that shape our world.',symbol:'“ ”',color:'gold'}
];
const defaultClubs=[
{id:'ideas',name:'The Ideas Society',description:'A meeting place for readers, thinkers, and thoughtful conversations.',symbol:'“ ”',color:'gold'},
{id:'nature',name:'Naturalists Club',description:'Discover the natural world with a community of curious observers.',symbol:'✳',color:'blue'},
{id:'builders',name:'The Builders Guild',description:'Learn by making, share your experiments, and build together.',symbol:'⌘',color:''}
];
let schools=[];let clubs=[];let courses=[
{id:'philosophy',school:'humanities',title:'Introduction to Philosophy',description:'An invitation to think deeply about knowledge, ethics, and a life well lived.',credits:3,club:'ideas',weeks:[
['The art of asking questions','Read an introduction to the Socratic method. Write five philosophical questions and examine one assumption behind each.'],
['Knowledge & belief','Study rationalism and empiricism. Compare how observation and reason support a belief in a 300-word reflection.'],
['Living an ethical life','Explore virtue ethics, duty, and consequentialism. Apply all three approaches to an everyday ethical dilemma.'],
['Your philosophy of life','Review your reflections. Write a 600-word statement of your own philosophy and respond to a possible objection.']]},
{id:'literature',school:'humanities',title:'Reading World Literature',description:'Travel across cultures through close reading, powerful stories, and new perspectives.',credits:3,club:'ideas',weeks:[
['Ways of reading','Choose a public-domain short story. Annotate its imagery, narrative voice, and central conflict.'],
['Poetry & place','Read three poems from different places. Compare their use of rhythm and setting in a reading journal.'],
['Character & culture','Read a novella of your choice. Explore how cultural context shapes one character’s decisions.'],
['A critical response','Write a comparative essay using passages from two works you have read. Revise for clarity and evidence.']]},
{id:'ecology',school:'biology',title:'Ecology & the Living World',description:'Discover the connections between organisms, ecosystems, and the places we call home.',credits:4,club:'nature',weeks:[
['Thinking in ecosystems','Study producers, consumers, and decomposers. Sketch a food web for a local habitat.'],
['Biodiversity close to home','Observe a nearby green space. Record ten organisms or signs of life without disturbing them.'],
['Populations & change','Explore carrying capacity and population growth. Sketch and explain two possible growth patterns.'],
['Energy & nutrient cycles','Trace carbon and water through an ecosystem. Create a labelled diagram of their interactions.'],
['Human impact','Research a local environmental challenge. Compare two potential responses and their trade-offs.'],
['An ecosystem field report','Combine your observations into a field report with evidence, limitations, and conservation recommendations.']]},
{id:'astronomy',school:'mathematics',title:'A Beginner’s Guide to the Cosmos',description:'Build a sense of our place in the universe, from the night sky to distant galaxies.',credits:3,club:'nature',weeks:[
['Mapping the night sky','Learn celestial coordinates and identify three constellations using a sky map. Keep an observation log.'],
['Our solar system','Compare the inner and outer planets. Create a scale model or table showing their relative distances.'],
['The lives of stars','Study stellar formation and evolution. Draw an annotated life cycle for a Sun-like star.'],
['Galaxies & the universe','Explore galaxy types and cosmic expansion. Prepare a short illustrated guide explaining what you learned.']]},
{id:'web',school:'computing',title:'Foundations of Web Design',description:'Create accessible, expressive websites with the building blocks of the web.',credits:4,club:'builders',weeks:[
['The web & semantic HTML','Study how a browser loads a page. Build an HTML document using headings, landmarks, links, and lists.'],
['CSS fundamentals','Practice selectors, the box model, typography, and colour. Style your page with a consistent visual hierarchy.'],
['Responsive layouts','Learn Flexbox and Grid. Create a layout that works on both phone and desktop widths.'],
['Interaction with JavaScript','Study variables, events, and DOM updates. Add an interactive checklist to your page.'],
['Accessibility & usability','Check keyboard navigation, form labels, and colour contrast. Improve your page based on the results.'],
['Build & reflect','Finish a small multi-section website. Test its main interactions and write a brief explanation of your design choices.']]},
{id:'data',school:'mathematics',title:'Thinking with Data',description:'Find patterns, ask useful questions, and tell clearer stories with evidence.',credits:3,club:'builders',weeks:[
['From questions to data','Choose a question and locate a small public dataset. Document what each column represents and its limitations.'],
['Cleaning & summarising','Identify missing values and inconsistencies. Calculate useful summaries and explain your cleaning decisions.'],
['Seeing patterns','Create two charts that answer your question. Label them clearly and examine possible misleading interpretations.'],
['Telling an honest story','Write a short report combining charts, findings, uncertainty, and a follow-up question.']]}
];
const key='openfield-university-v1';
let saved={};let storageAvailable=true;
try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){storageAvailable=false}
schools=Array.isArray(saved.schools)?saved.schools:defaultSchools.map(s=>({...s}));
clubs=Array.isArray(saved.clubRecords)?saved.clubRecords:defaultClubs.map(c=>({...c,frequency:Number(c.frequency)||1}));
let state={courses:saved.courses&&typeof saved.courses==='object'?saved.courses:{},clubs:Array.isArray(saved.clubs)?saved.clubs.filter(id=>clubs.some(c=>c.id===id)):[],role:saved.role==='admin'?'admin':'student',addedCourses:Array.isArray(saved.addedCourses)?saved.addedCourses:[],books:Array.isArray(saved.books)?saved.books:[],research:Array.isArray(saved.research)?saved.research:[],submissions:saved.submissions&&typeof saved.submissions==='object'?saved.submissions:{},syllabus:saved.syllabus&&typeof saved.syllabus==='object'?saved.syllabus:{},attendance:saved.attendance&&typeof saved.attendance==='object'?saved.attendance:{},attendanceDays:saved.attendanceDays&&typeof saved.attendanceDays==='object'?saved.attendanceDays:{}};
courses.push(...state.addedCourses);
for(const c of courses){if(state.syllabus[c.id]){c.school=state.syllabus[c.id].school||c.school;c.title=state.syllabus[c.id].title||c.title;c.description=state.syllabus[c.id].description||c.description;c.credits=state.syllabus[c.id].credits||c.credits;c.club=state.syllabus[c.id].club||'';c.weeks=state.syllabus[c.id].weeks||c.weeks;c.duration=state.syllabus[c.id].duration||c.duration;c.syllabus=state.syllabus[c.id].syllabus||c.syllabus;c.additionalResources=state.syllabus[c.id].additionalResources||c.additionalResources}}
for(const c of courses){if(!Array.isArray(c.syllabus)||!c.syllabus.length){c.syllabus=(c.weeks||[]).map((week,index)=>({week:index+1,title:week[0]||'',resourceLink:'',taskDescription:week[1]||''}))}c.duration=Math.max(1,Number(c.duration)||c.syllabus.length||c.weeks?.length||1);c.syllabus=Array.from({length:c.duration},(_,index)=>c.syllabus[index]||{week:index+1,title:'',resourceLink:'',taskDescription:''}).map((entry,index)=>({...entry,week:index+1}));c.weeks=c.syllabus.map(entry=>[entry.title||'Week '+entry.week,entry.taskDescription||''])}
function migrateSyllabus(c){const savedSyllabus=state.syllabus[c.id]?.syllabus||c.syllabus;const legacy=c.weeks||[];const entries=Array.isArray(savedSyllabus)&&savedSyllabus.length?savedSyllabus:legacy.map((week,index)=>({week:index+1,title:week[0]||'',resourceLink:'',taskDescription:week[1]||''}));const duration=Math.max(1,Number(c.duration)||entries.length||1);c.duration=duration;c.syllabus=Array.from({length:duration},(_,index)=>{const entry=entries[index]||{};return{week:index+1,title:entry.title||'',resourceLink:entry.resourceLink||'',taskDescription:entry.taskDescription??entry.task??''}});c.weeks=c.syllabus.map(entry=>[entry.title,entry.taskDescription]);c.additionalResources=Array.isArray(state.syllabus[c.id]?.additionalResources)?state.syllabus[c.id].additionalResources:Array.isArray(c.additionalResources)?c.additionalResources:[]}
for(const c of courses)migrateSyllabus(c);
for(const c of courses){const p=state.courses[c.id];if(p){p.weeks=Array.from({length:c.weeks.length},(_,i)=>p.weeks?.[i]===true);p.final=p.final===true&&p.weeks.every(Boolean)}}
let schoolFilter='all';
const app=document.getElementById('app');
function persist(){try{localStorage.setItem(key,JSON.stringify({...state,schools,clubRecords:clubs}));return true}catch(e){storageAvailable=false;toast('Browser storage is unavailable. Progress will last for this session only.');return false}}
function toast(message){document.getElementById('toast').textContent=message;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function progress(c){return state.courses[c.id]||{weeks:c.weeks.map(()=>false),final:false}}
function completed(c){const p=progress(c);return p.final&&p.weeks.every(Boolean)}
function credits(){return courses.reduce((sum,c)=>sum+(completed(c)?c.credits:0),0)}
function count(c){return progress(c).weeks.filter(Boolean).length}
function stats(){return '<div class="stats">'+[[credits(),'Credits earned','From completed courses'],[state.submissions.reviews?Object.keys(state.submissions.reviews).length:0,'Books reviewed','Your reading journey'],[state.research.length,'Research papers','Ideas worth exploring'],[state.clubs.length,'Club memberships','Find your people']].map(x=>'<div class="stat"><small>'+x[1]+'</small><strong>'+x[0]+'</strong><span>'+x[2]+'</span></div>').join('')+'</div>'}
function heading(eyebrow,title,sub){return '<div class="heading"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div><span class="pill">Learn at your own pace</span></div>'}

function home(){const active=courses.filter(c=>state.courses[c.id]&&!completed(c));return heading('A place for curious minds','Your next chapter starts here.','Explore new ideas. Find your people. Make learning your own.')+'<section class="hero"><div><div class="eyebrow">Welcome to Openfield</div><h2>A whole world to learn.<br>A space to make it yours.</h2><p>Follow your curiosity across schools, build knowledge week by week, and celebrate every step forward.</p><a class="btn light" href="#schools">Explore schools & courses ↗</a></div><div class="hero-art" aria-hidden="true"><div class="book"><small>OPENFIELD NOTES</small>Stay<br>curious.<br>↗</div></div></section>'+stats()+'<div class="section-head"><h2>'+(active.length?'Continue your learning':'Find your first course')+'</h2><a href="#schools">View all courses →</a></div><div class="grid">'+(active.length?active:courses.filter(c=>['philosophy','ecology','web'].includes(c.id))).map(courseCard).join('')+'</div>'}
function schoolPage(){return heading('Schools & courses','Follow your curiosity.','Nine schools. Different perspectives. A shared love of learning.')+'<div class="grid">'+schools.map(s=>'<article class="card"><div class="card-body"><div class="eyebrow">'+(courses.filter(c=>c.school===s.id).length ? courses.filter(c=>c.school===s.id).length+' course'+(courses.filter(c=>c.school===s.id).length===1?'':'s')+' · open enrolment' : 'Courses coming soon')+'</div><h3>'+s.name+'</h3><p>'+s.description+'</p><button class="btn outline" data-school="'+s.id+'">Explore school →</button></div></article>').join('')+'</div><div class="section-head"><h2>Explore the course catalogue</h2><span class="sub">Earn credits as you learn</span></div><div class="filters" aria-label="Filter courses by school">'+[{id:'all',name:'All schools'},...schools].map(s=>'<button class="filter '+(schoolFilter===s.id?'active':'')+'" aria-pressed="'+(schoolFilter===s.id)+'" data-school="'+s.id+'">'+s.name.replace('School of ','')+'</button>').join('')+'</div><div class="grid" id="catalogue">'+(courses.filter(c=>schoolFilter==='all'||c.school===schoolFilter).map(courseCard).join('') || '<div class="panel" style="grid-column:1/-1"><h3>More learning is on its way.</h3><p class="sub">Courses for this school are coming soon. Explore another school in the meantime.</p></div>')+'</div>'}
function coursePage(id){const c=courses.find(c=>c.id===id);if(!c)return heading('Not found','Course not found.','Choose a course from Schools & courses.');const s=schools.find(s=>s.id===c.school),club=clubs.find(x=>x.id===c.club),p=progress(c),enrolled=!!state.courses[c.id],all=p.weeks.every(Boolean);return '<a class="back" href="#schools">← Back to schools & courses</a>'+heading(s.name,c.title,c.description)+'<div class="detail"><section class="panel"><div class="section-head" style="margin-top:0"><h2>Your syllabus</h2><span class="pill">'+count(c)+' of '+c.weeks.length+' weeks</span></div><p class="sub">Complete each week’s material and activity, then tick it off. Your final unlocks when all weeks are complete.</p><div class="progress"><div style="width:'+count(c)/c.weeks.length*100+'%"></div></div>'+c.weeks.map((w,i)=>'<div class="week '+(p.weeks[i]?'done':'')+'"><input type="checkbox" id="week-'+i+'" data-week="'+i+'" data-course="'+c.id+'" '+(p.weeks[i]?'checked ':'')+(!enrolled?'disabled':'')+'><div><small>WEEK '+String(i+1).padStart(2,'0')+'</small><label for="week-'+i+'">'+w[0]+'</label><p>'+w[1]+'</p></div></div>').join('')+'<div class="final-check"><input type="checkbox" id="final" data-final="'+c.id+'" '+(p.final?'checked ':'')+(!enrolled||!all?'disabled':'')+'><div><label for="final"><strong>Final · Course completion</strong></label><p>'+(p.final?'Course complete! '+c.credits+' credits have been added to your account.':all?'Review your work and tick the final to confirm completion and receive '+c.credits+' credits.':'Complete all '+c.weeks.length+' weeks to unlock your final and earn '+c.credits+' credits.')+'</p></div></div><p class="notice">Completion is self-assessed. Unchecking a week or the final removes this course’s credits until it is completed again.</p></section><aside><div class="panel"><div class="eyebrow">At a glance</div><div class="aside-row"><span>Duration</span><strong>'+c.weeks.length+' weeks</strong></div><div class="aside-row"><span>Course credits</span><strong>'+c.credits+' credits</strong></div><div class="aside-row"><span>Format</span><strong>Self-paced</strong></div><div class="aside-row"><span>Status</span><strong>'+(p.final?'Completed':enrolled?'Enrolled':'Not started')+'</strong></div>'+(!enrolled?'<button style="width:100%;margin-top:22px" class="btn" data-enrol="'+c.id+'">Enrol in this course →</button>':'<p class="notice">Your progress is saved automatically in this browser.</p>')+'</div><div class="panel"><div class="eyebrow">Keep the conversation going</div><h3 style="margin-top:15px">'+club.name+'</h3><p class="sub">'+club.description+'</p><a class="btn outline" style="margin-top:20px" href="#clubs">Explore your course club →</a></div></aside></div>'}
function clubPage(){return heading('Clubs & societies','Learning is better together.','Find a community that shares your interests. Membership is open to everyone.')+'<div class="grid">'+clubs.map(club=>'<article class="card"><div class="course-art '+club.color+'"><span>OPENFIELD COMMUNITY</span><b aria-hidden="true">'+club.symbol+'</b></div><div class="card-body"><h3>'+club.name+'</h3><p>'+club.description+'</p><div class="eyebrow">Connected courses</div>'+courses.filter(c=>c.club===club.id).map(c=>'<a style="font-size:12px;margin-bottom:14px" href="#course/'+c.id+'">'+c.title+' ↗</a>').join('')+'<div class="card-footer"><span>'+ (state.clubs.includes(club.id)?'✓ You’re a member':'Find your community')+'</span><button class="btn '+(state.clubs.includes(club.id)?'outline':'')+'" data-club="'+club.id+'">'+(state.clubs.includes(club.id)?'Leave club':'Join club')+'</button></div></div></article>').join('')+'</div>'}
function placeholder(type){const reading=type==='reading';return heading(reading?'Reading programme':'Independent research',reading?'One book. A new beginning.':'Make room for your next question.',reading?'A home for your reading journey.':'A space to explore, investigate, and share what you discover.')+(reading?'<div class="grid">'+(state.books.length?state.books.map(b=>'<article class="card book-card"><div class="card-body"><span class="book-level">Level '+b.level+'</span><h3>'+b.title+'</h3><p>'+b.author+'</p><div class="card-footer"><span>Read and reflect</span><a class="btn outline" href="#book/'+b.id+'">Write review →</a></div></div></article>').join(''):'<div class="panel" style="grid-column:1/-1"><h3>No books have been added yet.</h3><p class="sub">Your administrator will build the reading list for Levels 1–7.</p></div>')+'</div>':'<div class="stack">'+(state.research.length?state.research.map(r=>'<article class="panel"><div class="eyebrow">Submitted research</div><h3>'+r.title+'</h3><p>'+r.abstract+'</p><a href="'+r.link+'" target="_blank" rel="noreferrer">Open research link ↗</a></article>').join(''):'<div class="panel"><p class="sub">Your submitted research will appear here.</p></div>')+'<section class="panel"><div class="section-head" style="margin-top:0"><h2>Add a research paper</h2></div><form data-form="research" class="form-grid"><div class="field"><label for="research-title">Title</label><input id="research-title" name="title" required></div><div class="field"><label for="research-link">Link</label><input id="research-link" name="link" type="url" placeholder="https://" required></div><div class="field full"><label for="research-abstract">Abstract or notes</label><textarea id="research-abstract" name="abstract" required></textarea></div><div class="full"><button class="btn" type="submit">Submit research ↗</button></div></form></section></div>')}
function finalPage(id){const c=courses.find(c=>c.id===id);if(!c)return heading('Not found','Final not found.','Return to your course.');const savedFinal=state.submissions.finals&&state.submissions.finals[id];return '<a class="back" href="#course/'+id+'">← Back to course</a>'+heading('Final submission',c.title,'Share the work that completes this course.')+'<section class="panel"><form data-form="final" data-course="'+id+'" class="form-grid"><div class="field full"><label for="final-link">Link to your work</label><input id="final-link" name="link" type="url" placeholder="https://" value="'+(savedFinal?.link||'')+'"></div><div class="field full"><label for="final-file">Or attach a file</label><input id="final-file" name="file" type="file"></div><div class="field full"><label for="final-note">Note to your tutor</label><textarea id="final-note" name="note">'+(savedFinal?.note||'')+'</textarea></div><div class="full"><button class="btn" type="submit">Submit final work ↗</button></div></form>'+(savedFinal?'<div class="submission"><div class="eyebrow">Submitted</div><p><strong>'+ (savedFinal.file||savedFinal.link) +'</strong></p><p class="sub">Your final work is saved on this device.</p></div>':'')+'</section>'}
function bookPage(id){const b=state.books.find(book=>book.id===id);if(!b)return heading('Not found','Book not found.','Choose a book from the reading programme.');const review=state.submissions.reviews&&state.submissions.reviews[id];return '<a class="back" href="#reading">← Back to reading programme</a>'+heading('Reading programme',b.title,b.author+' · Level '+b.level)+'<section class="panel"><form data-form="review" data-book="'+id+'" class="stack"><div class="field"><label for="review-text">Your review</label><textarea id="review-text" name="review" required>'+ (review?.review||'')+'</textarea></div><button class="btn" type="submit">Submit book review ↗</button></form>'+(review?'<div class="submission"><div class="eyebrow">Submitted</div><p>'+review.review+'</p></div>':'')+'</section>'}

button class="btn" type="submit">Save syllabus changes ↗</button></div></form></section><section class="panel admin-panel"><div class="section-head" style="margin-top:0"><h2>Add a reading programme book</h2></div><form data-form="book" class="form-grid"><div class="field"><label for="book-title">Book title</label><input id="book-title" name="title" required></div><div class="field"><label for="book-author">Author</label><input id="book-author" name="author" required></div><div class="field"><label for="book-level">Level</label><select id="book-level" name="level">'+[1,2,3,4,5,6,7].map(n=>'<option>'+n+'</option>').join('')+'</select></div><div class="full"><button class="btn" type="submit">Add book ↗</button></div></form></section>'}
function profile(){const enrolled=courses.filter(c=>state.courses[c.id]);return heading('My profile','Your learning, at a glance.','Every small step adds up to something meaningful.')+'<div class="profile-head"><div class="avatar">L</div><div><h2>Openfield learner</h2><p class="sub">Your personal learning account · Stored on this device</p></div></div>'+stats()+'<div class="section-head"><h2>My courses</h2><span class="sub">'+enrolled.filter(completed).length+' completed · '+enrolled.filter(c=>!completed(c)).length+' in progress</span></div>'+(enrolled.length?'<div class="grid">'+enrolled.map(courseCard).join('')+'</div>':'<div class="panel"><p class="sub">Your learning journey is ready when you are.</p><a class="btn" style="margin-top:18px" href="#schools">Find your first course →</a></div>')+'<div class="section-head"><h2>My communities</h2><a href="#clubs">Explore clubs →</a></div><div class="panel">'+(state.clubs.length?clubs.filter(c=>state.clubs.includes(c.id)).map(c=>'<p><a href="#clubs">'+c.name+' ↗</a></p>').join(''):'<p class="sub">You haven’t joined a club yet. Find people who share your curiosity.</p>')+'</div><p class="notice">Credits are learning milestones within this website, not accredited university credits. Books and research counts will become available when those programmes launch.</p>'}
function render(){const [route='home',id]=location.hash.slice(1).split('/');const page=['home','schools','clubs','reading','research','profile','course','final','book','admin'].includes(route)?route:'home';document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===(page==='course'||page==='final'||page==='book'?'schools':page);a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const names={home:'Overview',schools:'Schools & courses',clubs:'Clubs & societies',reading:'Reading programme',research:'Independent research',profile:'My profile',course:'Course syllabus',final:'Final submission',book:'Book review',admin:'Administrator'};document.getElementById('breadcrumb').textContent='Your campus / '+names[page];document.title=names[page]+' — Openfield University';document.getElementById('role-label').textContent=state.role==='admin'?'Administrator view':'Student view';document.getElementById('role-toggle').textContent=state.role==='admin'?'Switch to student':'Switch to administrator';app.innerHTML=({home,schools:schoolPage,clubs:clubPage,profile,reading:()=>placeholder('reading'),research:()=>placeholder('research'),course:()=>coursePage(id),final:()=>finalPage(id),book:()=>bookPage(id),admin})[page]()+'<footer><span>OPENFIELD UNIVERSITY · A place for curious minds</span><span>'+(storageAvailable?'Progress saved on this browser':'Session only · Browser storage unavailable')+'</span></footer>'}
const syllabusPage=coursePage;coursePage=id=>syllabusPage(id)+'<a class="btn outline" href="#final/'+id+'">Submit final work →</a>';
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const structuredCoursePage=coursePage;coursePage=function(id){const c=courses.find(course=>course.id===id);if(!c)return structuredCoursePage(id);let page=structuredCoursePage(id);c.syllabus.forEach((entry,index)=>{const marker='<label for="week-'+index+'">'+entry.title+'</label>';const resource=entry.resourceLink?'<p class="syllabus-resource"><a href="'+esc(entry.resourceLink)+'" target="_blank" rel="noreferrer">Open weekly resource ↗</a></p>':'';page=page.replace(marker,marker+resource)});const resources=c.additionalResources||[];const resourcePanel=resources.length?'<section class="panel additional-resources"><div class="eyebrow">Additional useful resources</div>'+resources.map(resource=>'<p><a href="'+esc(resource.link)+'" target="_blank" rel="noreferrer">'+esc(resource.title)+' ↗</a></p>').join('')+'</section>':'';return page.replace('<div class="detail">',resourcePanel+'<div class="detail">')};

function schoolDetail(id){const school=schools.find(s=>s.id===id);if(!school)return heading('Not found','School not found.','Return to Schools & courses.');const schoolCourses=courses.filter(c=>c.school===id);return '<a class="back" href="#schools">← Back to schools & courses</a>'+heading(school.name,school.name,'Courses and ideas from this school.')+'<div class="grid">'+(schoolCourses.length?schoolCourses.map(courseCard).join(''):'<div class="panel" style="grid-column:1/-1"><h3>Courses coming soon.</h3><p class="sub">Your administrator has not added a course to this school yet.</p></div>')+'</div>'}

function attendanceDays(club){const selected=state.attendanceDays[club.id]||[];return ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(day=>'<label><input type="checkbox" data-attendance-day="'+club.id+'" value="'+day+'" '+(selected.includes(day)?'checked':'')+'> '+day+'</label>').join('')}

app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.attend){const [clubId,date]=b.dataset.attend.split('|');state.attendance[clubId]=state.attendance[clubId]||{};state.attendance[clubId][date]=true;persist();render();toast('Attendance recorded.')}if(b.dataset.deleteSchool){schools=schools.filter(s=>s.id!==b.dataset.deleteSchool);persist();render();toast('School deleted.')}if(b.dataset.deleteClub){const id=b.dataset.deleteClub;clubs=clubs.filter(c=>c.id!==id);state.clubs=state.clubs.filter(c=>c!==id);courses.forEach(c=>{if(c.club===id)c.club=''});persist();render();toast('Club deleted.')}if(b.dataset.deleteBook){state.books=state.books.filter(book=>book.id!==b.dataset.deleteBook);persist();render();toast('Book deleted.')}});
app.addEventListener('change',e=>{const el=e.target;if(el.dataset.attendanceDay){const id=el.dataset.attendanceDay;const club=clubs.find(c=>c.id===id);const days=state.attendanceDays[id]||[];const next=el.checked?[...new Set([...days,el.value])]:days.filter(day=>day!==el.value);if(next.length>(club?.frequency||1)){el.checked=false;toast('Choose no more than '+club.frequency+' attendance days.');return}state.attendanceDays[id]=next;persist();render()}if(el.dataset.final){const c=courses.find(c=>c.id===el.dataset.final);if(el.checked&&c?.club&&!state.clubs.includes(c.club)){state.clubs.push(c.club);persist();toast('Course completed. Club membership added automatically.')}}});
app.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form||!['school-admin-create','course-admin-create'].includes(form.dataset.form))return;e.preventDefault();const data=new FormData(form);const weeks=String(data.get('weeks')||'').split('\n').filter(Boolean).map(line=>{const parts=line.split('|');return[(parts[0]||'Untitled week').trim(),(parts[1]||'Complete the assigned activity.').trim()]});if(form.dataset.form==='school-admin-create'){schools.push({id:'school-'+Date.now(),name:data.get('name'),description:data.get('description'),symbol:data.get('symbol'),color:''});toast('School added.');location.hash='schools'}if(form.dataset.form==='course-admin-create'){const course={id:'course-'+Date.now(),school:data.get('school'),title:data.get('title'),description:data.get('description'),credits:Number(data.get('credits')),club:data.get('club')||'',weeks};courses.push(course);state.addedCourses.push(course);toast('Course added.');location.hash='schools'}persist();render()});
app.addEventListener('submit',e=>{const form=e.target;if(!['club-admin-create','club-edit'].includes(form.dataset.form))return;e.preventDefault();const data=new FormData(form);const details={name:data.get('name'),description:data.get('description'),symbol:data.get('symbol'),color:'',frequency:Number(data.get('frequency'))||1};if(form.dataset.form==='club-admin-create'){clubs.push({id:'club-'+Date.now(),...details});toast('Club added.')}else{const club=clubs.find(item=>item.id===form.dataset.id);if(club)Object.assign(club,details);toast('Club updated.')}persist();location.hash='clubs';render()});
app.addEventListener('click',e=>{const add=e.target.closest('[data-add-resource]');if(add){const container=document.getElementById('additional-resources');const index=container.querySelectorAll('[data-resource-row]').length;container.insertAdjacentHTML('beforeend',resourceFields([{title:'',link:''}]).replace(/resource-title-0/g,'resource-title-'+index).replace(/resource-link-0/g,'resource-link-'+index));const empty=document.querySelector('[data-no-resources]');if(empty)empty.hidden=true}const remove=e.target.closest('[data-remove-resource]');if(remove){remove.closest('[data-resource-row]').remove();}});
app.addEventListener('change',e=>{if(e.target.id!=='course-duration')return;const form=e.target.form;const duration=Math.max(1,Math.min(52,Number(e.target.value)||1));e.target.value=duration;const entries=Array.from({length:duration},(_,index)=>({week:index+1,title:form.elements['week-title-'+index]?.value||'',resourceLink:form.elements['week-resource-'+index]?.value||'',taskDescription:form.elements['week-task-'+index]?.value||''}));document.getElementById('syllabus-weeks').innerHTML=structuredWeekFields(entries)});
app.addEventListener('submit',e=>{const form=e.target;if(form.dataset.form!=='course-structured')return;e.preventDefault();const data=new FormData(form);const duration=Math.max(1,Math.min(52,Number(data.get('duration'))||1));const syllabus=Array.from({length:duration},(_,index)=>({week:index+1,title:String(data.get('week-title-'+index)||'').trim(),resourceLink:String(data.get('week-resource-'+index)||'').trim(),taskDescription:String(data.get('week-task-'+index)||'').trim()}));const additionalResources=[];for(let index=0;data.has('resource-title-'+index)||data.has('resource-link-'+index);index++){const title=String(data.get('resource-title-'+index)||'').trim();const link=String(data.get('resource-link-'+index)||'').trim();if(title||link)additionalResources.push({title,link})}const title=String(data.get('title')||'').trim();const description=String(data.get('description')||'').trim();const credits=Number(data.get('credits'));if(!title||!description||!Number.isFinite(credits)||credits<1||syllabus.some(entry=>!entry.title||!entry.taskDescription)){toast('Complete the course title, description, credits, and each syllabus week.');return}const courseData={school:data.get('school'),title,description,credits,club:data.get('club')||'',duration,syllabus,additionalResources,weeks:syllabus.map(entry=>[entry.title,entry.taskDescription])};let course;if(form.dataset.id){course=courses.find(item=>item.id===form.dataset.id);if(!course){toast('Course could not be found.');return}Object.assign(course,courseData);state.syllabus[course.id]=courseData;const added=state.addedCourses.find(item=>item.id===course.id);if(added)Object.assign(added,course)}else{course={id:'course-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),...courseData};courses.push(course);state.addedCourses.push(course);state.syllabus[course.id]=courseData}persist();toast(form.dataset.id?'Course updated.':'Course added.');location.hash=form.dataset.returnSchool?'school/'+form.dataset.returnSchool:'schools';render()});
/* Multi-week course editor.  This listener deliberately runs in capture phase so the
   legacy catch-all submit listener cannot render (and discard) this form mid-save. */
function weekLabel(start,duration){const end=start+duration-1;return duration===1?'Week '+start:'Weeks '+start+'–'+end}
function normaliseCourseSections(course){
  const raw=Array.isArray(course.syllabus)&&course.syllabus.length?course.syllabus:(course.weeks||[]).map((w,i)=>({startWeek:i+1,durationWeeks:1,title:w[0]||'',resourceLink:'',taskDescription:w[1]||''}));
  let start=1;
  course.syllabus=raw.map(entry=>{const duration=Math.max(1,Math.min(52,Number(entry.durationWeeks)||1));const section={startWeek:start,durationWeeks:duration,title:String(entry.title||''),resourceLink:String(entry.resourceLink||''),taskDescription:String(entry.taskDescription??entry.task??'')};start+=duration;return section});
  course.duration=Math.max(1,Number(course.duration)||start-1);
  course.additionalResources=Array.isArray(course.additionalResources)?course.additionalResources:[];
  course.weeks=course.syllabus.flatMap(section=>Array.from({length:section.durationWeeks},()=>[section.title,section.taskDescription]));
  return course;
}
courses.forEach(normaliseCourseSections);
function sectionFields(entries){let start=1;return entries.map((entry,index)=>{const duration=Math.max(1,Number(entry.durationWeeks)||1);const label=weekLabel(start,duration);start+=duration;return '<section class="syllabus-week" data-section><h3 data-range>'+label+'</h3><div class="field"><label>Duration</label><input name="section-duration-'+index+'" type="number" min="1" max="52" value="'+duration+'"> <span class="sub">weeks</span></div><div class="field"><label>Title</label><input name="section-title-'+index+'" value="'+esc(entry.title)+'"></div><div class="field"><label>Resource link</label><input name="section-resource-'+index+'" type="url" value="'+esc(entry.resourceLink)+'" placeholder="https://"></div><div class="field"><label>Task / description</label><textarea name="section-task-'+index+'">'+esc(entry.taskDescription)+'</textarea></div><div class="section-actions"><button class="btn outline" type="button" data-remove-section>Remove section</button></div></section>'}).join('')}
function editorSections(form){return Array.from(form.querySelectorAll('[data-section]')).map((node,index)=>({durationWeeks:Math.max(1,Number(form.elements['section-duration-'+index]?.value)||1),title:String(form.elements['section-title-'+index]?.value||'').trim(),resourceLink:String(form.elements['section-resource-'+index]?.value||'').trim(),taskDescription:String(form.elements['section-task-'+index]?.value||'').trim()}))}
function refreshSectionEditor(form){const entries=editorSections(form);document.getElementById('syllabus-weeks').innerHTML=sectionFields(entries);const total=entries.reduce((n,s)=>n+s.durationWeeks,0),duration=Math.max(1,Number(form.elements.duration.value)||1),summary=document.getElementById('syllabus-coverage');summary.textContent='Syllabus coverage: '+total+' / '+duration+' weeks'+(total===duration?'':' — adjust section durations before saving.');summary.classList.toggle('invalid',total!==duration)}
function structuredCourseForm(id){const c=id?courses.find(course=>course.id===id):null;if(id&&!c)return heading('Not found','Course not found.','Return to Schools & courses.');const course=normaliseCourseSections(c||{title:'',description:'',credits:3,school:schools[0]?.id||'',club:'',duration:4,syllabus:[{durationWeeks:1,title:'',resourceLink:'',taskDescription:''}],additionalResources:[]});const total=course.syllabus.reduce((n,s)=>n+s.durationWeeks,0);return heading('Administrator · Courses',id?'Edit course':'Add course',id?'Update this course’s details.':'Add a course to the shared catalogue.')+'<a class="back" href="#schools">← Back to schools & courses</a><form data-form="course-structured" data-id="'+(id||'')+'" class="syllabus-editor"><section class="panel admin-panel"><div class="form-grid"><div class="field"><label>Course title</label><input name="title" value="'+esc(course.title)+'" required></div><div class="field"><label>School</label><select name="school">'+schools.map(s=>'<option value="'+s.id+'" '+(s.id===course.school?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div><div class="field"><label>Credits</label><input name="credits" type="number" min="1" value="'+course.credits+'" required></div><div class="field"><label>Connected club</label><select name="club"><option value="">No connected club</option>'+clubs.map(club=>'<option value="'+club.id+'" '+(club.id===course.club?'selected':'')+'>'+esc(club.name)+'</option>').join('')+'</select></div><div class="field full"><label>Course description</label><textarea name="description" required>'+esc(course.description)+'</textarea></div><div class="field"><label>Course duration</label><input id="course-duration" name="duration" type="number" min="1" max="52" value="'+course.duration+'" required><span class="sub">weeks</span></div></div></section><section><div class="section-head"><h2>Syllabus</h2><button class="btn outline" type="button" data-add-section>+ Add syllabus section</button></div><div id="syllabus-coverage" class="syllabus-summary '+(total===course.duration?'':'invalid')+'">Syllabus coverage: '+total+' / '+course.duration+' weeks'+(total===course.duration?'':' — adjust section durations before saving.')+'</div><div id="syllabus-weeks">'+sectionFields(course.syllabus)+'</div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>Additional useful resources</h2><button class="btn outline" type="button" data-add-resource>+ Add resource</button></div><div id="additional-resources">'+resourceFields(course.additionalResources)+'</div><p class="sub" data-no-resources '+(course.additionalResources.length?'hidden':'')+'>No additional resources yet.</p></section><button class="btn" type="submit">'+(id?'Save course':'Save course')+' ↗</button></form>'}
adminCourseForm=function(id){const schoolId=!id?location.hash.slice(1).split('/')[1]:'';let html=structuredCourseForm(id);if(schoolId){html=html.replace(/<option value="[^"]+" selected>/g,match=>match.replace(' selected',''));html=html.replace(new RegExp('value="'+schoolId+'"'), 'value="'+schoolId+'" selected')}return html};
app.addEventListener('click',e=>{const form=e.target.closest('form[data-form="course-structured"]');if(!form)return;if(e.target.closest('[data-add-section]')){const entries=editorSections(form);entries.push({durationWeeks:1,title:'',resourceLink:'',taskDescription:''});document.getElementById('syllabus-weeks').innerHTML=sectionFields(entries);refreshSectionEditor(form)}if(e.target.closest('[data-remove-section]')){e.target.closest('[data-section]').remove();refreshSectionEditor(form)}});
app.addEventListener('input',e=>{const form=e.target.form;if(form?.dataset.form==='course-structured'&&(e.target.name==='duration'||e.target.name?.startsWith('section-duration-')))refreshSectionEditor(form)});
app.addEventListener('change',e=>{const form=e.target.form;if(form?.dataset.form==='course-structured'&&e.target.name==='duration'){e.stopImmediatePropagation();refreshSectionEditor(form)}},true);
app.addEventListener('submit',e=>{const form=e.target;if(form.dataset.form!=='course-structured')return;e.preventDefault();e.stopImmediatePropagation();const data=new FormData(form),duration=Math.max(1,Math.min(52,Number(data.get('duration'))||1)),syllabus=editorSections(form);const coverage=syllabus.reduce((n,s)=>n+s.durationWeeks,0),title=String(data.get('title')||'').trim(),description=String(data.get('description')||'').trim(),credits=Number(data.get('credits'));if(!title||!description||!Number.isFinite(credits)||credits<1||!data.get('school')||syllabus.length===0||syllabus.some(s=>!s.title||!s.taskDescription)||coverage!==duration){toast(coverage!==duration?'Syllabus coverage must equal the course duration. Your work is still here.':'Complete all required course and syllabus fields. Your work is still here.');return}const additionalResources=[];for(let i=0;data.has('resource-title-'+i)||data.has('resource-link-'+i);i++){const title=String(data.get('resource-title-'+i)||'').trim(),link=String(data.get('resource-link-'+i)||'').trim();if(title||link)additionalResources.push({title,link})}const details={school:data.get('school'),title,description,credits,club:data.get('club')||'',duration,syllabus,additionalResources};let course=form.dataset.id?courses.find(c=>c.id===form.dataset.id):null;if(form.dataset.id&&!course){toast('Course could not be found. Your form has not been cleared.');return}if(course)Object.assign(course,details);else{course={id:'course-'+Date.now()+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36),...details};courses.push(course);state.addedCourses.push(course)}normaliseCourseSections(course);state.syllabus[course.id]={...details,weeks:course.weeks};if(!persist()){toast('Course could not be saved. Your form is still populated.');return}toast(form.dataset.id?'Course updated.':'Course added.');location.hash='schools';render()},true);
const legacyCoursePage=coursePage;coursePage=function(id){const c=courses.find(x=>x.id===id);if(!c)return legacyCoursePage(id);normaliseCourseSections(c);const school=schools.find(s=>s.id===c.school)||{name:'School'},club=clubs.find(x=>x.id===c.club),p=progress(c),enrolled=!!state.courses[c.id],all=p.weeks.every(Boolean);const sections=c.syllabus.map(s=>{const checks=Array.from({length:s.durationWeeks},(_,i)=>{const n=s.startWeek-1+i;return '<label style="display:inline-flex;gap:5px;margin:12px 12px 0 0;font-size:11px"><input type="checkbox" data-week="'+n+'" data-course="'+c.id+'" '+(p.weeks[n]?'checked ':'')+(!enrolled?'disabled':'')+'> Week '+(n+1)+'</label>'}).join('');return '<div class="week"><small>'+weekLabel(s.startWeek,s.durationWeeks).toUpperCase()+'</small><label>'+esc(s.title)+'</label>'+(s.resourceLink?'<p><a href="'+esc(s.resourceLink)+'" target="_blank" rel="noreferrer">Resource ↗</a></p>':'')+'<p>'+esc(s.taskDescription)+'</p>'+checks+'</div>'}).join('');const extras=c.additionalResources.length?'<section class="panel"><div class="eyebrow">Additional useful resources</div>'+c.additionalResources.map(r=>'<p><a href="'+esc(r.link)+'" target="_blank" rel="noreferrer">'+esc(r.title||r.link)+' ↗</a></p>').join('')+'</section>':'';return '<a class="back" href="#schools">← Back to schools & courses</a>'+heading(school.name,c.title,c.description)+'<div class="detail"><section class="panel student-syllabus"><div class="section-head" style="margin-top:0"><h2>Syllabus</h2><span class="pill">'+count(c)+' / '+c.duration+' weeks</span></div>'+sections+'<div class="final-check"><input type="checkbox" data-final="'+c.id+'" '+(p.final?'checked ':'')+(!enrolled||!all?'disabled':'')+'><div><strong>Final · Course completion</strong><p>'+(all?'Review your work and tick the final to confirm completion.':'Complete every scheduled week to unlock the final.')+'</p></div></div></section><aside><div class="panel"><div class="eyebrow">At a glance</div><div class="aside-row"><span>Duration</span><strong>'+c.duration+' weeks</strong></div><div class="aside-row"><span>Course credits</span><strong>'+c.credits+' credits</strong></div>'+(!enrolled?'<button style="width:100%;margin-top:22px" class="btn" data-enrol="'+c.id+'">Enrol in this course →</button>':'')+'</div>'+extras+(club?'<div class="panel"><div class="eyebrow">Connected club</div><h3 style="margin-top:15px">'+esc(club.name)+'</h3></div>':'')+'</aside></div>'};
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
