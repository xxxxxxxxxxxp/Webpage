<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Openfield University — Your campus, your pace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body.auth-required .sidebar,
    body.auth-required .topbar {
      display: none
    }

    body.auth-required .layout {
      display: block
    }

    body.auth-required .content {
      max-width: 560px;
      padding-top: 72px
    }

    .auth-card {
      max-width: 500px;
      margin: 0 auto
    }

    .auth-card .form-grid {
      margin-top: 22px
    }

    .auth-message {
      min-height: 20px;
      color: #a04b32;
      font-size: 12px;
      margin-top: 12px
    }

    .auth-switch {
      margin-top: 16px;
      font-size: 12px
    }

    .auth-switch button {
      border: 0;
      background: transparent;
      color: var(--green);
      padding: 0;
      text-decoration: underline
    }
  </style>
  <style>
    :root {
      --bg: #f5f4ef;
      --paper: #fff;
      --ink: #203c33;
      --muted: #738078;
      --line: #dce2da;
      --green: #315b48;
      --lime: #dbe8ab;
      --serif: Georgia, 'Times New Roman', serif
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 14px
    }

    button,
    input {
      font: inherit
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent
    }

    button {
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 3px solid #a58235;
      outline-offset: 4px
    }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: #edf0e7;
      border-right: 1px solid var(--line);
      padding: 34px 24px;
      display: flex;
      flex-direction: column
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 48px
    }

    .seal {
      display: grid;
      place-items: center;
      width: 38px;
      height: 44px;
      border: 1px solid var(--green);
      border-radius: 4px 4px 18px 18px;
      font-family: var(--serif);
      font-size: 25px
    }

    .brand strong {
      font: 23px var(--serif)
    }

    .brand small {
      display: block;
      font-size: 9px;
      letter-spacing: 3px;
      margin-top: 4px
    }

    .nav-label,
    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted)
    }

    nav {
      display: grid;
      gap: 7px;
      margin-top: 17px
    }

    nav a {
      padding: 13px 12px;
      border-radius: 6px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px
    }

    nav a.active {
      background: var(--green);
      color: white
    }

    nav a:hover:not(.active) {
      background: #e0e6d9
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 17px
    }

    .side-bottom {
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding-top: 22px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7
    }

    .side-bottom strong {
      color: var(--ink)
    }

    .main {
      min-width: 0
    }

    .topbar {
      height: 81px;
      padding: 0 44px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafaf7
    }

    .topbar span {
      font-size: 12px;
      color: var(--muted)
    }

    .profile-link {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px
    }

    .avatar {
      width: 33px;
      height: 33px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e3e8d8;
      color: var(--green);
      font-weight: 700
    }

    .content {
      max-width: 1370px;
      margin: auto;
      padding: 42px 44px 28px
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 28px
    }

    h1 {
      font: 42px/1.13 var(--serif);
      letter-spacing: -1px;
      margin: 11px 0 12px
    }

    h2 {
      font: 26px var(--serif);
      margin: 0
    }

    h3 {
      font: 22px var(--serif);
      margin: 0 0 12px
    }

    p {
      line-height: 1.7
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0
    }

    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 7px 11px;
      font-size: 10px;
      white-space: nowrap
    }

    .hero {
      background: var(--ink);
      color: white;
      border-radius: 10px;
      padding: 35px 38px;
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 20px;
      overflow: hidden;
      margin-bottom: 30px
    }

    .hero .eyebrow {
      color: var(--lime)
    }

    .hero h2 {
      font-size: 36px;
      line-height: 1.2;
      max-width: 440px;
      margin: 16px 0
    }

    .hero p {
      color: #c0cec2;
      font-size: 12px;
      max-width: 400px
    }

    .hero-art {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 160px
    }

    .hero-art:before,
    .hero-art:after {
      content: '';
      position: absolute;
      width: 210px;
      height: 210px;
      border: 1px solid #68816b;
      border-radius: 50%
    }

    .hero-art:after {
      width: 270px;
      height: 270px
    }

    .book {
      position: relative;
      z-index: 1;
      width: 135px;
      height: 150px;
      border: 1px solid #d8e5aa;
      background: #45634e;
      transform: rotate(-13deg);
      border-radius: 3px 9px 9px 3px;
      box-shadow: 10px 8px 0 #acbb91;
      padding: 27px 18px;
      font: 24px/1.3 var(--serif);
      color: #e9edca
    }

    .book small {
      display: block;
      font: 8px Arial;
      letter-spacing: 2px;
      margin-bottom: 12px
    }

    .btn {
      display: inline-block;
      background: var(--green);
      color: white;
      border: 1px solid var(--green);
      border-radius: 5px;
      padding: 11px 16px;
      font-size: 12px;
      font-weight: 600
    }

    .btn.light {
      background: var(--lime);
      color: var(--ink);
      border-color: var(--lime)
    }

    .btn.outline {
      background: transparent;
      color: var(--green);
      border-color: var(--line)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 36px
    }

    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 21px
    }

    .stat small {
      color: var(--muted);
      font-size: 11px
    }

    .stat strong {
      display: block;
      font: 34px var(--serif);
      margin: 13px 0 7px
    }

    .stat span {
      font-size: 10px;
      color: var(--muted)
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 30px 0 20px
    }

    .section-head a {
      font-size: 11px;
      border-bottom: 1px solid var(--muted);
      padding-bottom: 4px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 19px
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .card-body {
      padding: 23px;
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .card p {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 22px
    }

    .card .eyebrow {
      font-size: 9px;
      letter-spacing: 1.3px;
      margin-bottom: 12px
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 11px
    }

    .course-art {
      height: 105px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 23px;
      background: #e4e9dd;
      overflow: hidden
    }

    .course-art b {
      font: 54px var(--serif);
      font-weight: 400;
      opacity: .55
    }

    .course-art span {
      font-size: 10px;
      letter-spacing: 2px
    }

    .course-art.gold {
      background: #eee5d3
    }

    .course-art.blue {
      background: #e0e8eb
    }

    .course-art.rose {
      background: #eee0d9
    }

    .meta {
      display: flex;
      gap: 15px;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 19px
    }

    .progress {
      height: 5px;
      background: #e8ece5;
      border-radius: 5px;
      overflow: hidden;
      margin: 12px 0
    }

    .progress div {
      height: 100%;
      background: var(--green)
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 22px 0
    }

    .filter {
      border: 1px solid var(--line);
      border-radius: 25px;
      background: transparent;
      color: var(--muted);
      padding: 9px 15px;
      font-size: 12px
    }

    .filter.active {
      background: var(--green);
      color: white;
      border-color: var(--green)
    }

    .detail {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 27px
    }

    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 20px
    }

    .week {
      display: flex;
      gap: 16px;
      padding: 22px 0;
      border-bottom: 1px solid var(--line)
    }

    .week:last-child {
      border-bottom: 0
    }

    .week input,
    .final-check input {
      width: 19px;
      height: 19px;
      accent-color: var(--green);
      flex-shrink: 0;
      margin: 3px 0
    }

    .week label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer
    }

    .week small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 7px;
      letter-spacing: 1px
    }

    .week p {
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0 0
    }

    .week.done label {
      text-decoration: line-through;
      color: var(--muted)
    }

    .final-check {
      display: flex;
      gap: 14px;
      background: #edf2e3;
      border: 1px solid #cdd9bc;
      border-radius: 6px;
      padding: 20px;
      margin-top: 20px
    }

    .final-check strong {
      font-size: 13px
    }

    .final-check p {
      font-size: 12px;
      color: var(--muted);
      margin: 7px 0 0
    }

    .back {
      display: inline-block;
      font-size: 12px;
      margin-bottom: 25px;
      color: var(--muted)
    }

    .aside-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px
    }

    .aside-row span {
      color: var(--muted)
    }

    .empty {
      text-align: center;
      padding: 75px 25px;
      background: white;
      border: 1px dashed #bdc9b8;
      border-radius: 10px
    }

    .empty .symbol {
      font: 48px var(--serif);
      color: #819675;
      margin-bottom: 24px
    }

    .empty p {
      color: var(--muted);
      font-size: 13px
    }

    .profile-head {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 30px
    }

    .profile-head .avatar {
      width: 70px;
      height: 70px;
      font: 30px var(--serif)
    }

    .notice {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-top: 1px solid var(--line);
      margin-top: 45px;
      padding-top: 20px;
      color: var(--muted);
      font-size: 10px
    }

    #toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--ink);
      color: white;
      padding: 16px 22px;
      border-radius: 7px;
      max-width: 350px;
      z-index: 10;
      box-shadow: 0 8px 30px #0002
    }

    #toast:empty {
      display: none
    }

    @media(min-width:1450px) {
      .content {
        padding-top: 50px
      }

      .hero {
        padding: 42px
      }
    }

    @media(max-width:1100px) {
      .layout {
        grid-template-columns: 200px 1fr
      }

      .sidebar {
        padding: 28px 15px
      }

      .content {
        padding: 30px 26px
      }

      .topbar {
        padding: 0 26px
      }

      .grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .detail {
        grid-template-columns: 1fr
      }

      .stats {
        gap: 10px
      }

      .stat {
        padding: 16px
      }

      .hero-art:after {
        display: none
      }
    }

    @media(max-width:720px) {
      .layout {
        display: block
      }

      .sidebar {
        position: relative;
        height: auto;
        padding: 18px
      }

      .brand {
        margin-bottom: 16px
      }

      .nav-label,
      .side-bottom {
        display: none
      }

      nav {
        display: flex;
        overflow: auto;
        margin: 0;
        gap: 4px
      }

      nav a {
        white-space: nowrap;
        padding: 10px;
        font-size: 11px
      }

      .nav-icon {
        display: none
      }

      .topbar {
        height: 60px;
        padding: 0 20px
      }

      .content {
        padding: 27px 20px
      }

      .heading {
        align-items: start
      }

      h1 {
        font-size: 34px
      }

      .heading>.pill {
        display: none
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 27px
      }

      .hero h2 {
        font-size: 30px
      }

      .hero-art {
        display: none
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        margin-bottom: 28px
      }

      .grid {
        grid-template-columns: 1fr
      }

      .section-head h2 {
        font-size: 23px
      }

      footer {
        line-height: 1.7
      }

      .panel {
        padding: 20px
      }
    }
  </style>
  <style>
    .role-switch {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .role-badge {
      font-size: 10px !important;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--green) !important
    }

    .admin-panel {
      border-left: 4px solid #a58235
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .form-grid .full {
      grid-column: 1/-1
    }

    .field {
      display: grid;
      gap: 7px
    }

    .field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted)
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px;
      color: var(--ink);
      border-radius: 4px
    }

    .field textarea {
      min-height: 110px;
      resize: vertical
    }

    .stack {
      display: grid;
      gap: 18px
    }

    .book-level {
      display: inline-block;
      background: var(--lime);
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px
    }

    .submission {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      margin-top: 20px
    }

    .book-card {
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .book-card .card-footer {
      margin-top: auto
    }

    .notice strong {
      color: var(--ink)
    }

    @media(max-width:720px) {
      .form-grid {
        grid-template-columns: 1fr
      }

      .form-grid .full {
        grid-column: auto
      }

      .role-switch span:not(.role-badge) {
        display: none
      }
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px
    }

    .admin-actions .btn {
      margin: 0
    }

    .syllabus-editor {
      display: grid;
      gap: 18px
    }

    .syllabus-week {
      border: 1px solid var(--line);
      padding: 20px;
      background: #fbfcf8
    }

    .syllabus-week h3 {
      margin: 0 0 18px;
      font: 22px var(--serif)
    }

    .resource-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px
    }

    .resource-row .btn {
      margin: 0
    }

    .syllabus-resource {
      margin: 8px 0 0;
      font-size: 12px
    }

    .additional-resources {
      margin-top: 20px
    }
  </style>
  <style>
    .syllabus-summary {
      padding: 12px 15px;
      background: #edf2e3;
      border: 1px solid #cdd9bc;
      border-radius: 6px;
      color: var(--ink);
      font-size: 12px
    }

    .syllabus-summary.invalid {
      background: #fff2ed;
      border-color: #dfb7a5
    }

    .syllabus-week .section-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px
    }

    .student-syllabus .week {
      display: block
    }

    .student-syllabus .week small {
      margin-bottom: 8px
    }

    .student-syllabus .week a {
      font-size: 12px;
      color: var(--green);
      text-decoration: underline
    }

    .completed-book {
      border-color: var(--green);
      background: #eef5e4
    }

    .completed-book .book-level {
      background: var(--green);
      color: white
    }

    .stat-link {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--ink);
      font: 34px var(--serif);
      cursor: pointer
    }
  </style>
  <style>
    .graduation-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 19px
    }

    .graduation-card {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .graduation-card h3 {
      margin: 0
    }

    .requirement-box {
      background: #fbfcf8;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 15px;
      font-size: 12px
    }

    .requirement-box strong {
      display: block;
      font: 22px var(--serif);
      margin-top: 5px
    }

    .graduation-editor {
      display: grid;
      gap: 12px
    }

    .graduation-editor .field {
      gap: 5px;
      background: #fbfcf8;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px
    }

    .graduation-editor .field label {
      font-size: 9px
    }

    .graduation-editor input {
      padding: 9px
    }

    .graduation-card .admin-actions {
      margin-top: auto
    }

    @media(max-width:1100px) {
      .graduation-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(max-width:720px) {
      .graduation-grid {
        grid-template-columns: 1fr
      }
    }
  </style>
  <style>
    .commitment-list {
      display: grid;
      gap: 14px;
      margin-top: 18px
    }

    .commitment-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      background: #fbfcf8
    }

    .commitment-card.completed {
      border-color: var(--green);
      background: #eef5e4
    }

    .commitment-card h3 {
      font-size: 18px;
      margin: 0 0 8px
    }

    .commitment-meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px
    }

    .commitment-form-row {
      display: grid;
      grid-template-columns: 1.2fr .7fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px
    }

    .deadline-list {
      display: grid;
      gap: 10px
    }

    .deadline-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line)
    }

    .deadline-item:last-child {
      border-bottom: 0
    }

    .deadline-item strong {
      display: block
    }

      if (gradeMatch) { app.innerHTML = clubCommitmentGradePage(decodeURIComponent(gradeMatch[1])) + '<footer></footer>'; return; }
      renderBeforeClubCommitmentGrades();
    };
    const applyProfileBeforeClubCommitmentGrades = applyAuthenticatedProfile;
    applyAuthenticatedProfile = function (user, profile) { if (clubCommitmentGradeState.userId !== user.id || clubCommitmentGradeState.adminScope !== (profile.role === 'admin')) clearClubCommitmentGrades(); applyProfileBeforeClubCommitmentGrades(user, profile); };

    // Authoritative Club Commitment credit awards, keyed by subtype submission UUID.
    const clubCommitmentAwardState = { userId: null, ready: false, pending: null, error: null, adminScope: false, items: [], byCommitmentSubmission: {} };
    function clearClubCommitmentAwards() { Object.assign(clubCommitmentAwardState, { userId: null, ready: false, pending: null, error: null, adminScope: false, items: [], byCommitmentSubmission: {} }); }
    function clubCommitmentAward(commitmentSubmissionId) { return clubCommitmentAwardState.byCommitmentSubmission[String(commitmentSubmissionId)] || null; }
    async function loadClubCommitmentAwards(force = false) {
      const userId = authState.user?.id, adminScope = state.role === 'admin';
      if (!userId || (adminScope && !clubCommitmentSubmissionState.ready)) return;
      if (clubCommitmentAwardState.userId === userId && clubCommitmentAwardState.pending) return clubCommitmentAwardState.pending;
      if (!force && clubCommitmentAwardState.userId === userId && clubCommitmentAwardState.ready && clubCommitmentAwardState.adminScope === adminScope) return;
      Object.assign(clubCommitmentAwardState, { userId, ready: false, error: null, adminScope, items: [], byCommitmentSubmission: {} });
      const request = (async () => {
        let query = openfieldSupabase.from('credit_awards').select('id,student_id,academic_year,credit_amount,source_type,commitment_submission_id,note,awarded_at').eq('source_type', 'club_commitment');
        if (adminScope) {
          const subtypeIds = clubCommitmentSubmissionState.items.map(item => item.clubCommitmentSubmissionId).filter(Boolean);
          if (!subtypeIds.length) { clubCommitmentAwardState.ready = true; return; }
          query = query.in('commitment_submission_id', subtypeIds);
        } else query = query.eq('student_id', userId);
        const { data, error } = await query;
        if (error) throw error;
        if (authState.user?.id !== userId || (state.role === 'admin') !== adminScope) return;
        const items = data || [], byCommitmentSubmission = {};
        items.forEach(item => { if (item.commitment_submission_id && !byCommitmentSubmission[String(item.commitment_submission_id)]) byCommitmentSubmission[String(item.commitment_submission_id)] = item; });
        Object.assign(clubCommitmentAwardState, { items, byCommitmentSubmission, ready: true });
      })().catch(error => { if (authState.user?.id === userId && (state.role === 'admin') === adminScope) clubCommitmentAwardState.error = error; throw error; }).finally(() => { if (clubCommitmentAwardState.pending === request) clubCommitmentAwardState.pending = null; });
      clubCommitmentAwardState.pending = request;
      return request;
    }
    function clubCommitmentApprovalControls(submission) {
      const grade = clubCommitmentGrade(submission.submissionId), award = clubCommitmentAward(submission.clubCommitmentSubmissionId);
      if (submission.awarded) return award ? '<span class="sub">Already approved</span>' : '<span class="notice">Credit award record missing</span>';
      if (award) return '<span class="notice">Credit award exists; approval status needs reconciliation</span>';
      return '<button class="btn" type="button" data-approve-club-credit="' + esc(submission.clubCommitmentSubmissionId) + '" ' + (grade ? '' : 'disabled title="Grade this submission before approving it for credit."') + '>Approve for Credit</button>' + (grade ? '' : '<span class="sub">Grade this submission before approving it for credit.</span>');
    }
    async function reloadClubApprovalState() {
      await loadClubCommitmentServerState(true);
      await Promise.all([loadClubCommitmentGrades(true), loadClubCommitmentAwards(true)]);
    }
    async function approveClubCommitmentForCredit(commitmentSubmissionId) {
      if (state.role !== 'admin' || !authState.user?.id) throw new Error('Administrator access is required.');
      await reloadClubApprovalState();
      let submission = clubCommitmentSubmissionState.items.find(item => String(item.clubCommitmentSubmissionId) === String(commitmentSubmissionId));
      if (!submission) throw new Error('This Club Commitment submission is no longer available.');
      if (!clubCommitmentGrade(submission.submissionId)) throw new Error('Grade this submission before approving it for credit.');
      const definition = clubCommitmentDefinition(submission.commitmentDefinitionId), instance = clubCommitmentInstanceState.items.find(item => String(item.instanceId) === String(submission.commitmentInstanceId));
      const creditAmount = Number(definition?.credits);
      if (!definition || !Number.isFinite(creditAmount) || creditAmount < 0) throw new Error('The commitment does not have a valid configured credit amount.');
      if (!submission.studentId) throw new Error('The commitment Student could not be resolved.');
      if (!Number.isFinite(Number(submission.academicYear)) || Number(submission.academicYear) < 1) throw new Error('The submission academic year could not be resolved.');
      if (!instance) throw new Error('The commitment instance could not be resolved.');
      let award = clubCommitmentAward(submission.clubCommitmentSubmissionId);
      if (submission.awarded) return { alreadyApproved: true };
      const now = new Date().toISOString();
      let duplicateAwardRace = false;
      try {
        const claim = await openfieldSupabase.from('club_commitment_submissions').update({ awarded: true, awarded_credits: creditAmount, completed_at: now }).eq('id', submission.clubCommitmentSubmissionId).eq('submission_id', submission.submissionId).eq('awarded', false).select('id').maybeSingle();
        if (claim.error) throw claim.error;
        if (!claim.data) { await reloadClubApprovalState(); return { alreadyApproved: true }; }
        const instanceResult = await openfieldSupabase.from('club_commitment_instances').update({ status: 'completed' }).eq('id', instance.instanceId).eq('membership_id', instance.membershipId);
        if (instanceResult.error) throw instanceResult.error;
        if (!award) {
          const existingResult = await openfieldSupabase.from('credit_awards').select('id,student_id,academic_year,credit_amount,source_type,commitment_submission_id,note,awarded_at').eq('source_type', 'club_commitment').eq('commitment_submission_id', submission.clubCommitmentSubmissionId).limit(1);
          if (existingResult.error) throw existingResult.error;
          award = existingResult.data?.[0] || null;
        }
        if (!award) {
          const note = (definition.name || 'Club Commitment') + (instance.periodStart && instance.periodEnd ? ' · ' + instance.periodStart + ' – ' + instance.periodEnd : '');
          const awardResult = await openfieldSupabase.from('credit_awards').insert({ student_id: submission.studentId, academic_year: Number(submission.academicYear), credit_amount: creditAmount, source_type: 'club_commitment', course_enrollment_id: null, commitment_submission_id: submission.clubCommitmentSubmissionId, note, awarded_at: now });
          if (awardResult.error?.code === '23505') duplicateAwardRace = true;
          else if (awardResult.error) throw awardResult.error;
        }
      } finally { await reloadClubApprovalState(); }
      if (duplicateAwardRace) {
        const persistedAward = clubCommitmentAward(submission.clubCommitmentSubmissionId);
        if (!persistedAward) throw new Error('A duplicate credit award was reported, but the authoritative award record could not be loaded.');
        return { alreadyApproved: true };
      }
      return { alreadyApproved: false };
    }
    document.addEventListener('click', event => {
      const button = event.target.closest('[data-approve-club-credit]');
      if (!button) return;
      event.preventDefault(); event.stopImmediatePropagation();
      if (state.role !== 'admin') return;
      button.disabled = true;
      approveClubCommitmentForCredit(button.dataset.approveClubCredit).then(result => { toast(result.alreadyApproved ? 'This commitment has already been approved for credit.' : 'Commitment approved and credits awarded.'); render(); }).catch(error => { console.error('[Club Commitment approval] Approval failed:', error); toast('Credit approval failed: ' + (error.message || 'please try again.')); render(); });
    }, true);
    const creditsBeforeClubCommitmentAwards = credits;
    credits = function () { const courseCredits = creditsBeforeClubCommitmentAwards(); if (state.role !== 'student' || !clubCommitmentAwardState.ready || clubCommitmentAwardState.adminScope) return courseCredits; return courseCredits + Object.values(clubCommitmentAwardState.byCommitmentSubmission).reduce((sum, item) => sum + (Number(item.credit_amount) || 0), 0); };
    const statsBeforeClubCommitmentAwards = stats;
    stats = function () { return statsBeforeClubCommitmentAwards().replace('From completed courses', 'From completed courses and approved Club commitments'); };
    const renderBeforeClubCommitmentAwards = render;
    render = function () {
      const route = location.hash.slice(1).split('/')[0], needsAwards = route === 'clubs' || route === 'club' || route === 'profile' || (route === 'home' && state.role === 'student') || /^#grade\/commitment\|/.test(location.hash);
      if (!needsAwards || !authState.user) { renderBeforeClubCommitmentAwards(); return; }
      const adminScope = state.role === 'admin', submissionsReady = !adminScope || (clubCommitmentSubmissionState.ready && clubCommitmentSubmissionState.studentId === authState.user.id && clubCommitmentSubmissionState.adminScope === true);
      if (!submissionsReady) { renderBeforeClubCommitmentAwards(); return; }
      const scopeMatches = clubCommitmentAwardState.ready && clubCommitmentAwardState.userId === authState.user.id && clubCommitmentAwardState.adminScope === adminScope;
      if (!scopeMatches) {
        app.innerHTML = '<section class="panel"><h2>Loading Club credit awards</h2><p class="sub">Loading authoritative credit status…</p></section>';
        if (!clubCommitmentAwardState.pending) loadClubCommitmentAwards().then(() => render()).catch(error => { console.error('[Club Commitment awards] Load failed:', error); app.innerHTML = '<section class="panel"><h2>Credit awards unavailable</h2><p class="sub">' + esc(error.message || 'Please refresh and try again.') + '</p></section>'; });
        return;
      }
      renderBeforeClubCommitmentAwards();
    };
    const applyProfileBeforeClubCommitmentAwards = applyAuthenticatedProfile;
    applyAuthenticatedProfile = function (user, profile) { if (clubCommitmentAwardState.userId !== user.id || clubCommitmentAwardState.adminScope !== (profile.role === 'admin')) clearClubCommitmentAwards(); applyProfileBeforeClubCommitmentAwards(user, profile); };

    // Server-backed Club attendance. Weekdays follow JavaScript/Postgres convention: Sunday 0 through Saturday 6.
    const clubAttendanceState = { accountId: null, ready: false, loading: false, pending: null, error: null, adminScope: false, preferencesByMembership: {}, recordsByMembership: {}, profileNames: {}, savingMemberships: new Set() };
    const attendanceWeekdays = [{ value: 1, label: 'Monday' }, { value: 2, label: 'Tuesday' }, { value: 3, label: 'Wednesday' }, { value: 4, label: 'Thursday' }, { value: 5, label: 'Friday' }, { value: 6, label: 'Saturday' }, { value: 0, label: 'Sunday' }];
    function clearClubAttendance() { Object.assign(clubAttendanceState, { accountId: null, ready: false, loading: false, pending: null, error: null, adminScope: false, preferencesByMembership: {}, recordsByMembership: {}, profileNames: {}, savingMemberships: new Set() }); }
    async function loadClubAttendance(force = false) {
      const accountId = authState.user?.id, adminScope = state.role === 'admin';
      if (!accountId || !clubMembershipState.ready || clubMembershipState.studentId !== accountId || clubMembershipState.adminScope !== adminScope) return;
      if (clubAttendanceState.accountId === accountId && clubAttendanceState.pending) return clubAttendanceState.pending;
      if (!force && clubAttendanceState.accountId === accountId && clubAttendanceState.ready && clubAttendanceState.adminScope === adminScope) return;
      Object.assign(clubAttendanceState, { accountId, ready: false, loading: true, error: null, adminScope, preferencesByMembership: {}, recordsByMembership: {}, profileNames: {} });
      const membershipIds = clubMembershipState.items.map(item => item.id).filter(Boolean);
      const request = (async () => {
        if (!membershipIds.length) { clubAttendanceState.ready = true; return; }
        const [preferencesResult, recordsResult] = await Promise.all([
          openfieldSupabase.from('club_attendance_preferences').select('membership_id,weekday,created_at').in('membership_id', membershipIds),
          openfieldSupabase.from('club_attendance_records').select('id,membership_id,attendance_date,attended,recorded_at').in('membership_id', membershipIds)
        ]);
        if (preferencesResult.error) throw preferencesResult.error;
        if (recordsResult.error) throw recordsResult.error;
        const preferencesByMembership = {}, recordsByMembership = {};
        (preferencesResult.data || []).forEach(item => { (preferencesByMembership[String(item.membership_id)] ||= []).push(Number(item.weekday)); });
        Object.values(preferencesByMembership).forEach(items => items.sort((a, b) => a - b));
        (recordsResult.data || []).forEach(item => { (recordsByMembership[String(item.membership_id)] ||= {})[item.attendance_date] = item.attended === true; });
        const profileNames = {};
        if (adminScope) {
          const studentIds = [...new Set(clubMembershipState.items.map(item => item.student_id).filter(Boolean))];
          if (studentIds.length) {
            const result = await openfieldSupabase.from('profiles').select('id,display_name').in('id', studentIds);
            if (result.error) throw result.error;
            (result.data || []).forEach(item => { profileNames[item.id] = item.display_name || 'Student'; });
          }
        }
        if (authState.user?.id !== accountId || (state.role === 'admin') !== adminScope) return;
        Object.assign(clubAttendanceState, { preferencesByMembership, recordsByMembership, profileNames, ready: true });
      })().catch(error => { if (authState.user?.id === accountId && (state.role === 'admin') === adminScope) clubAttendanceState.error = error; throw error; }).finally(() => { if (clubAttendanceState.pending === request) clubAttendanceState.pending = null; if (authState.user?.id === accountId && (state.role === 'admin') === adminScope) clubAttendanceState.loading = false; });
      clubAttendanceState.pending = request;
      return request;
    }
    attendanceDays = function (club) {
      const membership = clubMembershipState.byClubId[String(club.id)], selected = membership ? (clubAttendanceState.preferencesByMembership[String(membership.id)] || []) : [];
      return attendanceWeekdays.map(day => '<label><input type="checkbox" data-attendance-day="' + esc(club.id) + '" value="' + day.value + '" ' + (selected.includes(day.value) ? 'checked' : '') + '> ' + day.label + '</label>').join('');
    };
    async function saveClubAttendancePreferences(clubId, selectedWeekdays) {
      if (state.role !== 'student' || !authState.user?.id || !clubAttendanceState.ready) throw new Error('Attendance is still loading.');
      const membership = clubMembershipState.byClubId[String(clubId)], club = clubs.find(item => String(item.id) === String(clubId));
      if (!membership || String(membership.student_id) !== String(authState.user.id)) throw new Error('An active Club membership is required.');
      const selected = [...new Set(selectedWeekdays.map(Number))];
      if (selected.some(day => !Number.isInteger(day) || day < 0 || day > 6)) throw new Error('One or more attendance weekdays are invalid.');
      if (selected.length > Number(club?.frequency || 1)) throw new Error('Choose no more than ' + Number(club?.frequency || 1) + ' attendance days.');
      const existing = clubAttendanceState.preferencesByMembership[String(membership.id)] || [], additions = selected.filter(day => !existing.includes(day)), removals = existing.filter(day => !selected.includes(day));
      try {
        if (additions.length) { const result = await openfieldSupabase.from('club_attendance_preferences').upsert(additions.map(weekday => ({ membership_id: membership.id, weekday })), { onConflict: 'membership_id,weekday' }); if (result.error) throw result.error; }
        if (removals.length) { const result = await openfieldSupabase.from('club_attendance_preferences').delete().eq('membership_id', membership.id).in('weekday', removals); if (result.error) throw result.error; }
      } catch (error) { await loadClubAttendance(true); throw error; }
      await loadClubAttendance(true);
    }
    async function markServerClubAttendance(clubId, attendanceDate) {
      if (state.role !== 'student' || !authState.user?.id || !clubAttendanceState.ready) throw new Error('Attendance is still loading.');
      const membership = clubMembershipState.byClubId[String(clubId)];
      if (!membership || String(membership.student_id) !== String(authState.user.id)) throw new Error('An active Club membership is required.');
      const allowedDates = new Set(Array.from({ length: 7 }, (_, index) => { const date = new Date(); date.setDate(date.getDate() - index); return isoDate(date); }));
      if (!allowedDates.has(attendanceDate)) throw new Error('Attendance can only be marked for today or the previous six days.');
      const { error } = await openfieldSupabase.from('club_attendance_records').upsert({ membership_id: membership.id, attendance_date: attendanceDate, attended: true, recorded_at: new Date().toISOString() }, { onConflict: 'membership_id,attendance_date' });
      if (error) { await loadClubAttendance(true); throw error; }
      await loadClubAttendance(true);
    }
    window.addEventListener('change', event => {
      const input = event.target.closest('input[data-attendance-day]');
      if (!input || state.role !== 'student') return;
      event.stopImmediatePropagation();
      const clubId = input.dataset.attendanceDay, membership = clubMembershipState.byClubId[String(clubId)], club = clubs.find(item => String(item.id) === String(clubId));
      if (!membership || !clubAttendanceState.ready) { input.checked = !input.checked; toast('Attendance is still loading.'); return; }
      const existing = clubAttendanceState.preferencesByMembership[String(membership.id)] || [], weekday = Number(input.value), selected = input.checked ? [...new Set([...existing, weekday])] : existing.filter(day => day !== weekday);
      if (selected.length > Number(club?.frequency || 1)) { input.checked = false; toast('Choose no more than ' + club.frequency + ' attendance days.'); return; }
      if (clubAttendanceState.savingMemberships.has(String(membership.id))) { input.checked = !input.checked; toast('Please wait for the current attendance update.'); return; }
      clubAttendanceState.savingMemberships.add(String(membership.id));
      input.closest('.attendance-days')?.querySelectorAll('input[data-attendance-day]').forEach(item => { item.disabled = true; });
      saveClubAttendancePreferences(clubId, selected).then(() => { toast('Preferred attendance days saved.'); render(); }).catch(error => { console.error('[Club attendance] Preference save failed:', error); toast('Attendance preferences could not be saved: ' + (error.message || 'please try again.')); render(); }).finally(() => clubAttendanceState.savingMemberships.delete(String(membership.id)));
    }, true);
    window.addEventListener('click', event => {
      const button = event.target.closest('button[data-attend]');
      if (!button || state.role !== 'student') return;
      event.preventDefault(); event.stopImmediatePropagation();
      const [clubId, attendanceDate] = String(button.dataset.attend || '').split('|');
      button.disabled = true;
      markServerClubAttendance(clubId, attendanceDate).then(() => { toast('Attendance recorded.'); render(); }).catch(error => { console.error('[Club attendance] Record save failed:', error); toast('Attendance could not be saved: ' + (error.message || 'please try again.')); button.disabled = false; });
    }, true);
    function serverAttendanceDates() {
      const dates = new Set();
      Object.values(clubAttendanceState.recordsByMembership).forEach(records => Object.entries(records).forEach(([date, attended]) => { if (attended) dates.add(date); }));
      return [...dates];
    }
    attendanceWeekCount = function () {
      const weeks = new Set();
      serverAttendanceDates().forEach(date => { const parsed = new Date(date + 'T12:00:00'); if (!Number.isNaN(parsed.getTime())) { parsed.setDate(parsed.getDate() - ((parsed.getDay() + 6) % 7)); weeks.add(isoDate(parsed)); } });
      return weeks.size;
    };
    attendanceForYear = function (year) {
      if (!clubAttendanceState.ready || clubAttendanceState.adminScope) return { weeks: 0, percentage: 0, expected: 1 };
      const start = new Date(state.yearStarts['year' + year] || 0).getTime(), next = state.yearStarts['year' + (Number(year) + 1)] ? new Date(state.yearStarts['year' + (Number(year) + 1)]).getTime() : Infinity;
      const dates = serverAttendanceDates().filter(date => { const time = new Date(date + 'T12:00:00').getTime(); return time >= start && time < next; });
      const weeks = new Set(dates.map(date => { const value = new Date(date + 'T12:00:00'); value.setDate(value.getDate() - ((value.getDay() + 6) % 7)); return isoDate(value); }));
      return { weeks: weeks.size, percentage: dates.length ? 100 : 0, expected: Math.max(1, weeks.size) };
    };
    const renderBeforeClubAttendance = render;
    render = function () {
      const route = location.hash.slice(1).split('/')[0], needsAttendance = route === 'clubs' || route === 'club' || (route === 'profile' && state.role === 'student');
      if (!needsAttendance || !authState.user) { renderBeforeClubAttendance(); return; }
      const adminScope = state.role === 'admin', membershipsReady = clubMembershipState.ready && clubMembershipState.studentId === authState.user.id && clubMembershipState.adminScope === adminScope;
      if (!membershipsReady) { renderBeforeClubAttendance(); return; }
      const scopeMatches = clubAttendanceState.ready && clubAttendanceState.accountId === authState.user.id && clubAttendanceState.adminScope === adminScope;
      if (!scopeMatches) {
        const error = clubAttendanceState.error;
        app.innerHTML = heading('Clubs & societies', error ? 'Attendance unavailable' : 'Loading attendance…', error ? (error.message || String(error)) : 'Loading attendance preferences and records from the server.');
        if (!error && !clubAttendanceState.pending) loadClubAttendance().then(() => render()).catch(() => render());
        return;
      }
      renderBeforeClubAttendance();
    };
    const applyProfileBeforeClubAttendance = applyAuthenticatedProfile;
    applyAuthenticatedProfile = function (user, profile) { if (clubAttendanceState.accountId !== user.id || clubAttendanceState.adminScope !== (profile.role === 'admin')) clearClubAttendance(); applyProfileBeforeClubAttendance(user, profile); };
    if (openfieldSupabase) openfieldSupabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') clearAdminNotificationReads(); });
    if (openfieldSupabase) openfieldSupabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') clearCourseFinalGrades(); });
    if (openfieldSupabase) openfieldSupabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') clearCourseFinalSubmissions(); });
    if (openfieldSupabase) openfieldSupabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') clearClubCommitmentServerState(); });
    if (openfieldSupabase) openfieldSupabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') clearClubCommitmentGrades(); });
    if (openfieldSupabase) openfieldSupabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') clearClubCommitmentAwards(); });
    if (openfieldSupabase) openfieldSupabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') clearClubAttendance(); });
    restoreSupabaseSession();
  </script>
</body>
