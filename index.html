<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Openfield University — Your campus, your pace</title>
<style>
:root{--bg:#f5f4ef;--paper:#fff;--ink:#203c33;--muted:#738078;--line:#dce2da;--green:#315b48;--lime:#dbe8ab;--serif:Georgia,'Times New Roman',serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;font-size:14px}button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #a58235;outline-offset:4px}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#edf0e7;border-right:1px solid var(--line);padding:34px 24px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;margin-bottom:48px}.seal{display:grid;place-items:center;width:38px;height:44px;border:1px solid var(--green);border-radius:4px 4px 18px 18px;font-family:var(--serif);font-size:25px}.brand strong{font:23px var(--serif)}.brand small{display:block;font-size:9px;letter-spacing:3px;margin-top:4px}.nav-label,.eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}nav{display:grid;gap:7px;margin-top:17px}nav a{padding:13px 12px;border-radius:6px;display:flex;gap:12px;align-items:center;font-size:13px}nav a.active{background:var(--green);color:white}nav a:hover:not(.active){background:#e0e6d9}.nav-icon{width:20px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:22px;font-size:12px;color:var(--muted);line-height:1.7}.side-bottom strong{color:var(--ink)}.main{min-width:0}.topbar{height:81px;padding:0 44px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fafaf7}.topbar span{font-size:12px;color:var(--muted)}.profile-link{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#e3e8d8;color:var(--green);font-weight:700}.content{max-width:1370px;margin:auto;padding:42px 44px 28px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}h1{font:42px/1.13 var(--serif);letter-spacing:-1px;margin:11px 0 12px}h2{font:26px var(--serif);margin:0}h3{font:22px var(--serif);margin:0 0 12px}p{line-height:1.7}.sub{color:var(--muted);font-size:13px;margin:0}.pill{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:7px 11px;font-size:10px;white-space:nowrap}.hero{background:var(--ink);color:white;border-radius:10px;padding:35px 38px;display:grid;grid-template-columns:1.6fr 1fr;gap:20px;overflow:hidden;margin-bottom:30px}.hero .eyebrow{color:var(--lime)}.hero h2{font-size:36px;line-height:1.2;max-width:440px;margin:16px 0}.hero p{color:#c0cec2;font-size:12px;max-width:400px}.hero-art{position:relative;display:flex;align-items:center;justify-content:center;min-height:160px}.hero-art:before,.hero-art:after{content:'';position:absolute;width:210px;height:210px;border:1px solid #68816b;border-radius:50%}.hero-art:after{width:270px;height:270px}.book{position:relative;z-index:1;width:135px;height:150px;border:1px solid #d8e5aa;background:#45634e;transform:rotate(-13deg);border-radius:3px 9px 9px 3px;box-shadow:10px 8px 0 #acbb91;padding:27px 18px;font:24px/1.3 var(--serif);color:#e9edca}.book small{display:block;font:8px Arial;letter-spacing:2px;margin-bottom:12px}.btn{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);border-radius:5px;padding:11px 16px;font-size:12px;font-weight:600}.btn.light{background:var(--lime);color:var(--ink);border-color:var(--lime)}.btn.outline{background:transparent;color:var(--green);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:36px}.stat{background:white;border:1px solid var(--line);border-radius:7px;padding:21px}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font:34px var(--serif);margin:13px 0 7px}.stat span{font-size:10px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:30px 0 20px}.section-head a{font-size:11px;border-bottom:1px solid var(--muted);padding-bottom:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:19px}.card{background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}.card-body{padding:23px;display:flex;flex-direction:column;flex:1}.card p{font-size:12px;color:var(--muted);margin:0 0 22px}.card .eyebrow{font-size:9px;letter-spacing:1.3px;margin-bottom:12px}.card-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:18px;border-top:1px solid var(--line);font-size:11px}.course-art{height:105px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:23px;background:#e4e9dd;overflow:hidden}.course-art b{font:54px var(--serif);font-weight:400;opacity:.55}.course-art span{font-size:10px;letter-spacing:2px}.course-art.gold{background:#eee5d3}.course-art.blue{background:#e0e8eb}.course-art.rose{background:#eee0d9}.meta{display:flex;gap:15px;color:var(--muted);font-size:11px;margin-bottom:19px}.progress{height:5px;background:#e8ece5;border-radius:5px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--green)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.filter{border:1px solid var(--line);border-radius:25px;background:transparent;color:var(--muted);padding:9px 15px;font-size:12px}.filter.active{background:var(--green);color:white;border-color:var(--green)}.detail{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:27px}.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:25px;margin-bottom:20px}.week{display:flex;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}.week:last-child{border-bottom:0}.week input,.final-check input{width:19px;height:19px;accent-color:var(--green);flex-shrink:0;margin:3px 0}.week label{display:block;font-weight:600;font-size:13px;cursor:pointer}.week small{display:block;color:var(--muted);font-size:10px;margin-bottom:7px;letter-spacing:1px}.week p{font-size:12px;color:var(--muted);margin:8px 0 0}.week.done label{text-decoration:line-through;color:var(--muted)}.final-check{display:flex;gap:14px;background:#edf2e3;border:1px solid #cdd9bc;border-radius:6px;padding:20px;margin-top:20px}.final-check strong{font-size:13px}.final-check p{font-size:12px;color:var(--muted);margin:7px 0 0}.back{display:inline-block;font-size:12px;margin-bottom:25px;color:var(--muted)}.aside-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:12px}.aside-row span{color:var(--muted)}.empty{text-align:center;padding:75px 25px;background:white;border:1px dashed #bdc9b8;border-radius:10px}.empty .symbol{font:48px var(--serif);color:#819675;margin-bottom:24px}.empty p{color:var(--muted);font-size:13px}.profile-head{display:flex;gap:20px;align-items:center;margin-bottom:30px}.profile-head .avatar{width:70px;height:70px;font:30px var(--serif)}.notice{font-size:11px;color:var(--muted);line-height:1.7}footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);margin-top:45px;padding-top:20px;color:var(--muted);font-size:10px}#toast{position:fixed;bottom:25px;right:25px;background:var(--ink);color:white;padding:16px 22px;border-radius:7px;max-width:350px;z-index:10;box-shadow:0 8px 30px #0002}#toast:empty{display:none}
@media(min-width:1450px){.content{padding-top:50px}.hero{padding:42px}}
@media(max-width:1100px){.layout{grid-template-columns:200px 1fr}.sidebar{padding:28px 15px}.content{padding:30px 26px}.topbar{padding:0 26px}.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:16px}.hero-art:after{display:none}}
@media(max-width:720px){.layout{display:block}.sidebar{position:relative;height:auto;padding:18px}.brand{margin-bottom:16px}.nav-label,.side-bottom{display:none}nav{display:flex;overflow:auto;margin:0;gap:4px}nav a{white-space:nowrap;padding:10px;font-size:11px}.nav-icon{display:none}.topbar{height:60px;padding:0 20px}.content{padding:27px 20px}.heading{align-items:start}h1{font-size:34px}.heading>.pill{display:none}.hero{grid-template-columns:1fr;padding:27px}.hero h2{font-size:30px}.hero-art{display:none}.stats{grid-template-columns:repeat(2,1fr);margin-bottom:28px}.grid{grid-template-columns:1fr}.section-head h2{font-size:23px}footer{line-height:1.7}.panel{padding:20px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<a href="#home" class="brand" aria-label="Openfield University home"><span class="seal">O</span><span><strong>openfield</strong><small>UNIVERSITY</small></span></a>
<div class="nav-label">Your campus</div>
<nav aria-label="Main navigation">
<a href="#home" data-nav="home"><span class="nav-icon">⌂</span>Overview</a>
<a href="#schools" data-nav="schools"><span class="nav-icon">▦</span>Schools & courses</a>
<a href="#clubs" data-nav="clubs"><span class="nav-icon">♧</span>Clubs & societies</a>
<a href="#reading" data-nav="reading"><span class="nav-icon">▤</span>Reading programme</a>
<a href="#research" data-nav="research"><span class="nav-icon">⌘</span>Independent research</a>
<a href="#profile" data-nav="profile"><span class="nav-icon">○</span>My profile</a>
</nav>
<div class="side-bottom"><strong>A little curiosity, every day.</strong><br>Make room for what you love to learn.<p>Self-paced learning<br>Unlimited possibilities</p></div>
</aside>
<div class="main"><header class="topbar"><span id="breadcrumb">Your campus / Overview</span><a class="profile-link" href="#profile"><span>My account</span><span class="avatar">L</span></a></header>
<main id="app" class="content"></main></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const schools=[
{id:'fitness',name:'School of Fitness',description:'Explore movement, physical training, and lifelong wellbeing.',symbol:'↗',color:''},
{id:'media',name:'School of Media and Arts',description:'Explore visual storytelling, creative expression, and the world of media.',symbol:'◈',color:'rose'},
{id:'performing',name:'School of Performing Arts',description:'Discover expression through music, theatre, dance, and performance.',symbol:'♫',color:'gold'},
{id:'languages',name:'School of Languages and Communication',description:'Build connections through languages, writing, and effective communication.',symbol:'Aa',color:'blue'},
{id:'computing',name:'School of Computer Science',description:'Explore computation, software, and the ideas behind digital systems.',symbol:'{ }',color:''},
{id:'mathematics',name:'School of Mathematics',description:'Discover patterns, logical reasoning, and the mathematics of our world.',symbol:'∑',color:'gold'},
{id:'biology',name:'School of Biology and Biomedical Sciences',description:'Understand living systems, from ecosystems to human biology and biomedical discovery.',symbol:'⌬',color:'blue'},
{id:'engineering',name:'School of Engineering and Robotics',description:'Design, build, and explore machines, robots, and practical solutions.',symbol:'⚙',color:'rose'},
{id:'humanities',name:'School of the Humanities',description:'Explore the ideas, stories, and questions that shape our world.',symbol:'“ ”',color:'gold'}
];
const clubs=[
{id:'ideas',name:'The Ideas Society',description:'A meeting place for readers, thinkers, and thoughtful conversations.',symbol:'“ ”',color:'gold'},
{id:'nature',name:'Naturalists Club',description:'Discover the natural world with a community of curious observers.',symbol:'✳',color:'blue'},
{id:'builders',name:'The Builders Guild',description:'Learn by making, share your experiments, and build together.',symbol:'⌘',color:''}
];
const courses=[
{id:'philosophy',school:'humanities',title:'Introduction to Philosophy',description:'An invitation to think deeply about knowledge, ethics, and a life well lived.',credits:3,club:'ideas',weeks:[
['The art of asking questions','Read an introduction to the Socratic method. Write five philosophical questions and examine one assumption behind each.'],
['Knowledge & belief','Study rationalism and empiricism. Compare how observation and reason support a belief in a 300-word reflection.'],
['Living an ethical life','Explore virtue ethics, duty, and consequentialism. Apply all three approaches to an everyday ethical dilemma.'],
['Your philosophy of life','Review your reflections. Write a 600-word statement of your own philosophy and respond to a possible objection.']]},
{id:'literature',school:'humanities',title:'Reading World Literature',description:'Travel across cultures through close reading, powerful stories, and new perspectives.',credits:3,club:'ideas',weeks:[
['Ways of reading','Choose a public-domain short story. Annotate its imagery, narrative voice, and central conflict.'],
['Poetry & place','Read three poems from different places. Compare their use of rhythm and setting in a reading journal.'],
['Character & culture','Read a novella of your choice. Explore how cultural context shapes one character’s decisions.'],
['A critical response','Write a comparative essay using passages from two works you have read. Revise for clarity and evidence.']]},
{id:'ecology',school:'biology',title:'Ecology & the Living World',description:'Discover the connections between organisms, ecosystems, and the places we call home.',credits:4,club:'nature',weeks:[
['Thinking in ecosystems','Study producers, consumers, and decomposers. Sketch a food web for a local habitat.'],
['Biodiversity close to home','Observe a nearby green space. Record ten organisms or signs of life without disturbing them.'],
['Populations & change','Explore carrying capacity and population growth. Sketch and explain two possible growth patterns.'],
['Energy & nutrient cycles','Trace carbon and water through an ecosystem. Create a labelled diagram of their interactions.'],
['Human impact','Research a local environmental challenge. Compare two potential responses and their trade-offs.'],
['An ecosystem field report','Combine your observations into a field report with evidence, limitations, and conservation recommendations.']]},
{id:'astronomy',school:'mathematics',title:'A Beginner’s Guide to the Cosmos',description:'Build a sense of our place in the universe, from the night sky to distant galaxies.',credits:3,club:'nature',weeks:[
['Mapping the night sky','Learn celestial coordinates and identify three constellations using a sky map. Keep an observation log.'],
['Our solar system','Compare the inner and outer planets. Create a scale model or table showing their relative distances.'],
['The lives of stars','Study stellar formation and evolution. Draw an annotated life cycle for a Sun-like star.'],
['Galaxies & the universe','Explore galaxy types and cosmic expansion. Prepare a short illustrated guide explaining what you learned.']]},
{id:'web',school:'computing',title:'Foundations of Web Design',description:'Create accessible, expressive websites with the building blocks of the web.',credits:4,club:'builders',weeks:[
['The web & semantic HTML','Study how a browser loads a page. Build an HTML document using headings, landmarks, links, and lists.'],
['CSS fundamentals','Practice selectors, the box model, typography, and colour. Style your page with a consistent visual hierarchy.'],
['Responsive layouts','Learn Flexbox and Grid. Create a layout that works on both phone and desktop widths.'],
['Interaction with JavaScript','Study variables, events, and DOM updates. Add an interactive checklist to your page.'],
['Accessibility & usability','Check keyboard navigation, form labels, and colour contrast. Improve your page based on the results.'],
['Build & reflect','Finish a small multi-section website. Test its main interactions and write a brief explanation of your design choices.']]},
{id:'data',school:'mathematics',title:'Thinking with Data',description:'Find patterns, ask useful questions, and tell clearer stories with evidence.',credits:3,club:'builders',weeks:[
['From questions to data','Choose a question and locate a small public dataset. Document what each column represents and its limitations.'],
['Cleaning & summarising','Identify missing values and inconsistencies. Calculate useful summaries and explain your cleaning decisions.'],
['Seeing patterns','Create two charts that answer your question. Label them clearly and examine possible misleading interpretations.'],
['Telling an honest story','Write a short report combining charts, findings, uncertainty, and a follow-up question.']]}
];
const key='openfield-university-v1';
let saved={};let storageAvailable=true;
try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){storageAvailable=false}
let state={courses:saved.courses&&typeof saved.courses==='object'?saved.courses:{},clubs:Array.isArray(saved.clubs)?saved.clubs.filter(id=>clubs.some(c=>c.id===id)):[]};
for(const c of courses){const p=state.courses[c.id];if(p){p.weeks=Array.from({length:c.weeks.length},(_,i)=>p.weeks?.[i]===true);p.final=p.final===true&&p.weeks.every(Boolean)}}
let schoolFilter='all';
const app=document.getElementById('app');
function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){storageAvailable=false;toast('Browser storage is unavailable. Progress will last for this session only.')}}
function toast(message){document.getElementById('toast').textContent=message;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function progress(c){return state.courses[c.id]||{weeks:c.weeks.map(()=>false),final:false}}
function completed(c){const p=progress(c);return p.final&&p.weeks.every(Boolean)}
function credits(){return courses.reduce((sum,c)=>sum+(completed(c)?c.credits:0),0)}
function count(c){return progress(c).weeks.filter(Boolean).length}
function stats(){return '<div class="stats">'+[[credits(),'Credits earned','From completed courses'],[0,'Books read','Your reading journey'],[0,'Research papers','Ideas worth exploring'],[state.clubs.length,'Club memberships','Find your people']].map(x=>'<div class="stat"><small>'+x[1]+'</small><strong>'+x[0]+'</strong><span>'+x[2]+'</span></div>').join('')+'</div>'}
function heading(eyebrow,title,sub){return '<div class="heading"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div><span class="pill">Learn at your own pace</span></div>'}
function courseCard(c){const s=schools.find(s=>s.id===c.school),p=progress(c);return '<article class="card"><div class="course-art '+s.color+'"><span>'+s.name.replace('School of ','').toUpperCase()+'</span><b aria-hidden="true">'+s.symbol+'</b></div><div class="card-body"><div class="eyebrow">'+(completed(c)?'Completed':state.courses[c.id]?'Your learning journey':'Open for discovery')+'</div><h3><a href="#course/'+c.id+'">'+c.title+'</a></h3><p>'+c.description+'</p><div class="meta"><span>'+c.weeks.length+' weeks</span><span>·</span><span>'+c.credits+' credits</span></div>'+(state.courses[c.id]?'<div class="progress" aria-label="'+count(c)+' of '+c.weeks.length+' weeks complete"><div style="width:'+count(c)/c.weeks.length*100+'%"></div></div>':'')+'<div class="card-footer"><span>'+ (completed(c)?'✓ Credits awarded':state.courses[c.id]?count(c)+' / '+c.weeks.length+' weeks complete':'A new perspective awaits')+'</span><a href="#course/'+c.id+'">'+(state.courses[c.id]?'View course':'Explore course')+' →</a></div></div></article>'}
function home(){const active=courses.filter(c=>state.courses[c.id]&&!completed(c));return heading('A place for curious minds','Your next chapter starts here.','Explore new ideas. Find your people. Make learning your own.')+'<section class="hero"><div><div class="eyebrow">Welcome to Openfield</div><h2>A whole world to learn.<br>A space to make it yours.</h2><p>Follow your curiosity across schools, build knowledge week by week, and celebrate every step forward.</p><a class="btn light" href="#schools">Explore schools & courses ↗</a></div><div class="hero-art" aria-hidden="true"><div class="book"><small>OPENFIELD NOTES</small>Stay<br>curious.<br>↗</div></div></section>'+stats()+'<div class="section-head"><h2>'+(active.length?'Continue your learning':'Find your first course')+'</h2><a href="#schools">View all courses →</a></div><div class="grid">'+(active.length?active:courses.filter(c=>['philosophy','ecology','web'].includes(c.id))).map(courseCard).join('')+'</div>'}
function schoolPage(){return heading('Schools & courses','Follow your curiosity.','Nine schools. Different perspectives. A shared love of learning.')+'<div class="grid">'+schools.map(s=>'<article class="card"><div class="card-body"><div class="eyebrow">'+(courses.filter(c=>c.school===s.id).length ? courses.filter(c=>c.school===s.id).length+' course'+(courses.filter(c=>c.school===s.id).length===1?'':'s')+' · open enrolment' : 'Courses coming soon')+'</div><h3>'+s.name+'</h3><p>'+s.description+'</p><button class="btn outline" data-school="'+s.id+'">Explore school →</button></div></article>').join('')+'</div><div class="section-head"><h2>Explore the course catalogue</h2><span class="sub">Earn credits as you learn</span></div><div class="filters" aria-label="Filter courses by school">'+[{id:'all',name:'All schools'},...schools].map(s=>'<button class="filter '+(schoolFilter===s.id?'active':'')+'" aria-pressed="'+(schoolFilter===s.id)+'" data-school="'+s.id+'">'+s.name.replace('School of ','')+'</button>').join('')+'</div><div class="grid" id="catalogue">'+(courses.filter(c=>schoolFilter==='all'||c.school===schoolFilter).map(courseCard).join('') || '<div class="panel" style="grid-column:1/-1"><h3>More learning is on its way.</h3><p class="sub">Courses for this school are coming soon. Explore another school in the meantime.</p></div>')+'</div>'}
function coursePage(id){const c=courses.find(c=>c.id===id);if(!c)return heading('Not found','Course not found.','Choose a course from Schools & courses.');const s=schools.find(s=>s.id===c.school),club=clubs.find(x=>x.id===c.club),p=progress(c),enrolled=!!state.courses[c.id],all=p.weeks.every(Boolean);return '<a class="back" href="#schools">← Back to schools & courses</a>'+heading(s.name,c.title,c.description)+'<div class="detail"><section class="panel"><div class="section-head" style="margin-top:0"><h2>Your syllabus</h2><span class="pill">'+count(c)+' of '+c.weeks.length+' weeks</span></div><p class="sub">Complete each week’s material and activity, then tick it off. Your final unlocks when all weeks are complete.</p><div class="progress"><div style="width:'+count(c)/c.weeks.length*100+'%"></div></div>'+c.weeks.map((w,i)=>'<div class="week '+(p.weeks[i]?'done':'')+'"><input type="checkbox" id="week-'+i+'" data-week="'+i+'" data-course="'+c.id+'" '+(p.weeks[i]?'checked ':'')+(!enrolled?'disabled':'')+'><div><small>WEEK '+String(i+1).padStart(2,'0')+'</small><label for="week-'+i+'">'+w[0]+'</label><p>'+w[1]+'</p></div></div>').join('')+'<div class="final-check"><input type="checkbox" id="final" data-final="'+c.id+'" '+(p.final?'checked ':'')+(!enrolled||!all?'disabled':'')+'><div><label for="final"><strong>Final · Course completion</strong></label><p>'+(p.final?'Course complete! '+c.credits+' credits have been added to your account.':all?'Review your work and tick the final to confirm completion and receive '+c.credits+' credits.':'Complete all '+c.weeks.length+' weeks to unlock your final and earn '+c.credits+' credits.')+'</p></div></div><p class="notice">Completion is self-assessed. Unchecking a week or the final removes this course’s credits until it is completed again.</p></section><aside><div class="panel"><div class="eyebrow">At a glance</div><div class="aside-row"><span>Duration</span><strong>'+c.weeks.length+' weeks</strong></div><div class="aside-row"><span>Course credits</span><strong>'+c.credits+' credits</strong></div><div class="aside-row"><span>Format</span><strong>Self-paced</strong></div><div class="aside-row"><span>Status</span><strong>'+(p.final?'Completed':enrolled?'Enrolled':'Not started')+'</strong></div>'+(!enrolled?'<button style="width:100%;margin-top:22px" class="btn" data-enrol="'+c.id+'">Enrol in this course →</button>':'<p class="notice">Your progress is saved automatically in this browser.</p>')+'</div><div class="panel"><div class="eyebrow">Keep the conversation going</div><h3 style="margin-top:15px">'+club.name+'</h3><p class="sub">'+club.description+'</p><a class="btn outline" style="margin-top:20px" href="#clubs">Explore your course club →</a></div></aside></div>'}
function clubPage(){return heading('Clubs & societies','Learning is better together.','Find a community that shares your interests. Membership is open to everyone.')+'<div class="grid">'+clubs.map(club=>'<article class="card"><div class="course-art '+club.color+'"><span>OPENFIELD COMMUNITY</span><b aria-hidden="true">'+club.symbol+'</b></div><div class="card-body"><h3>'+club.name+'</h3><p>'+club.description+'</p><div class="eyebrow">Connected courses</div>'+courses.filter(c=>c.club===club.id).map(c=>'<a style="font-size:12px;margin-bottom:14px" href="#course/'+c.id+'">'+c.title+' ↗</a>').join('')+'<div class="card-footer"><span>'+ (state.clubs.includes(club.id)?'✓ You’re a member':'Find your community')+'</span><button class="btn '+(state.clubs.includes(club.id)?'outline':'')+'" data-club="'+club.id+'">'+(state.clubs.includes(club.id)?'Leave club':'Join club')+'</button></div></div></article>').join('')+'</div>'}
function placeholder(type){const reading=type==='reading';return heading(reading?'Reading programme':'Independent research',reading?'One book. A new beginning.':'Make room for your next question.',reading?'A home for your reading journey.':'A space to explore, investigate, and share what you discover.')+'<section class="empty"><div class="symbol" aria-hidden="true">'+(reading?'▤':'⌘')+'</div><h2>'+(reading?'Your next chapter is on its way.':'Big ideas start with a little curiosity.')+'</h2><p>This space is coming soon. There is nothing here just yet.</p><a class="btn outline" href="#schools">Explore courses in the meantime →</a></section>'}
function profile(){const enrolled=courses.filter(c=>state.courses[c.id]);return heading('My profile','Your learning, at a glance.','Every small step adds up to something meaningful.')+'<div class="profile-head"><div class="avatar">L</div><div><h2>Openfield learner</h2><p class="sub">Your personal learning account · Stored on this device</p></div></div>'+stats()+'<div class="section-head"><h2>My courses</h2><span class="sub">'+enrolled.filter(completed).length+' completed · '+enrolled.filter(c=>!completed(c)).length+' in progress</span></div>'+(enrolled.length?'<div class="grid">'+enrolled.map(courseCard).join('')+'</div>':'<div class="panel"><p class="sub">Your learning journey is ready when you are.</p><a class="btn" style="margin-top:18px" href="#schools">Find your first course →</a></div>')+'<div class="section-head"><h2>My communities</h2><a href="#clubs">Explore clubs →</a></div><div class="panel">'+(state.clubs.length?clubs.filter(c=>state.clubs.includes(c.id)).map(c=>'<p><a href="#clubs">'+c.name+' ↗</a></p>').join(''):'<p class="sub">You haven’t joined a club yet. Find people who share your curiosity.</p>')+'</div><p class="notice">Credits are learning milestones within this website, not accredited university credits. Books and research counts will become available when those programmes launch.</p>'}
function render(){const [route='home',id]=location.hash.slice(1).split('/');const page=['home','schools','clubs','reading','research','profile','course'].includes(route)?route:'home';document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===(page==='course'?'schools':page);a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const names={home:'Overview',schools:'Schools & courses',clubs:'Clubs & societies',reading:'Reading programme',research:'Independent research',profile:'My profile',course:'Course syllabus'};document.getElementById('breadcrumb').textContent='Your campus / '+names[page];document.title=names[page]+' — Openfield University';app.innerHTML=({home,schools:schoolPage,clubs:clubPage,profile,reading:()=>placeholder('reading'),research:()=>placeholder('research'),course:()=>coursePage(id)})[page]()+'<footer><span>OPENFIELD UNIVERSITY · A place for curious minds</span><span>'+(storageAvailable?'Progress saved on this browser':'Session only · Browser storage unavailable')+'</span></footer>'}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.school){schoolFilter=b.dataset.school;render()}if(b.dataset.enrol){const c=courses.find(c=>c.id===b.dataset.enrol);if(!state.courses[c.id])state.courses[c.id]={weeks:c.weeks.map(()=>false),final:false};persist();render();toast('You’re enrolled. Your first week is ready.')}if(b.dataset.club){const id=b.dataset.club;const joined=state.clubs.includes(id);state.clubs=joined?state.clubs.filter(c=>c!==id):[...state.clubs,id];persist();render();toast(joined?'Club membership removed.':'Welcome to the club! Your profile has been updated.')}});
app.addEventListener('change',e=>{const el=e.target;if(el.dataset.week!==undefined){const p=state.courses[el.dataset.course];if(!p)return;const hadFinal=p.final;p.weeks[Number(el.dataset.week)]=el.checked;if(!el.checked)p.final=false;persist();render();if(hadFinal&&!p.final)toast('Course reopened. Credits will return when you complete the final again.')}if(el.dataset.final){const c=courses.find(c=>c.id===el.dataset.final),p=state.courses[c.id];if(!p||!p.weeks.every(Boolean))return;p.final=el.checked;persist();render();toast(p.final?'Course completed! '+c.credits+' credits added to your account.':'Final unchecked. Course credits removed.')}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script>
</body>
</html>
