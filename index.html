<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Openfield University — Your campus, your pace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body.auth-required .sidebar,
    body.auth-required .topbar {
      display: none
    }

    body.auth-required .layout {
      display: block
    }

    body.auth-required .content {
      max-width: 560px;
      padding-top: 72px
    }

    .auth-card {
      max-width: 500px;
      margin: 0 auto
    }

    .auth-card .form-grid {
      margin-top: 22px
    }

    .auth-message {
      min-height: 20px;
      color: #a04b32;
      font-size: 12px;
      margin-top: 12px
    }

    .auth-switch {
      margin-top: 16px;
      font-size: 12px
    }

    .auth-switch button {
      border: 0;
      background: transparent;
      color: var(--green);
      padding: 0;
      text-decoration: underline
    }
  </style>
  <style>
    :root {
      --bg: #f5f4ef;
      --paper: #fff;
      --ink: #203c33;
      --muted: #738078;
      --line: #dce2da;
      --green: #315b48;
      --lime: #dbe8ab;
      --serif: Georgia, 'Times New Roman', serif
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 14px
    }

    button,
    input {
      font: inherit
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent
    }

    button {
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 3px solid #a58235;
      outline-offset: 4px
    }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: #edf0e7;
      border-right: 1px solid var(--line);
      padding: 34px 24px;
      display: flex;
      flex-direction: column
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 48px
    }

    .seal {
      display: grid;
      place-items: center;
      width: 38px;
      height: 44px;
      border: 1px solid var(--green);
      border-radius: 4px 4px 18px 18px;
      font-family: var(--serif);
      font-size: 25px
    }

    .brand strong {
      font: 23px var(--serif)
    }

    .brand small {
      display: block;
      font-size: 9px;
      letter-spacing: 3px;
      margin-top: 4px
    }

    .nav-label,
    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted)
    }

    nav {
      display: grid;
      gap: 7px;
      margin-top: 17px
    }

    nav a {
      padding: 13px 12px;
      border-radius: 6px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px
    }

    nav a.active {
      background: var(--green);
      color: white
    }

    nav a:hover:not(.active) {
      background: #e0e6d9
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 17px
    }

    .side-bottom {
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding-top: 22px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7
    }

    .side-bottom strong {
      color: var(--ink)
    }

    .main {
      min-width: 0
    }

    .topbar {
      height: 81px;
      padding: 0 44px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafaf7
    }

    .topbar span {
      font-size: 12px;
      color: var(--muted)
    }

    .profile-link {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px
    }

    .avatar {
      width: 33px;
      height: 33px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e3e8d8;
      color: var(--green);
      font-weight: 700
    }

    .content {
      max-width: 1370px;
      margin: auto;
      padding: 42px 44px 28px
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 28px
    }

    h1 {
      font: 42px/1.13 var(--serif);
      letter-spacing: -1px;
      margin: 11px 0 12px
    }

    h2 {
      font: 26px var(--serif);
      margin: 0
    }

    h3 {
      font: 22px var(--serif);
      margin: 0 0 12px
    }

    p {
      line-height: 1.7
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0
    }

    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 7px 11px;
      font-size: 10px;
      white-space: nowrap
    }

    .hero {
      background: var(--ink);
      color: white;
      border-radius: 10px;
      padding: 35px 38px;
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 20px;
      overflow: hidden;
      margin-bottom: 30px
    }

    .hero .eyebrow {
      color: var(--lime)
    }

    .hero h2 {
      font-size: 36px;
      line-height: 1.2;
      max-width: 440px;
      margin: 16px 0
    }

    .hero p {
      color: #c0cec2;
      font-size: 12px;
      max-width: 400px
    }

    .hero-art {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 160px
    }

    .hero-art:before,
    .hero-art:after {
      content: '';
      position: absolute;
      width: 210px;
      height: 210px;
      border: 1px solid #68816b;
      border-radius: 50%
    }

    .hero-art:after {
      width: 270px;
      height: 270px
    }

    .book {
      position: relative;
      z-index: 1;
      width: 135px;
      height: 150px;
      border: 1px solid #d8e5aa;
      background: #45634e;
      transform: rotate(-13deg);
      border-radius: 3px 9px 9px 3px;
      box-shadow: 10px 8px 0 #acbb91;
      padding: 27px 18px;
      font: 24px/1.3 var(--serif);
      color: #e9edca
    }

    .book small {
      display: block;
      font: 8px Arial;
      letter-spacing: 2px;
      margin-bottom: 12px
    }

    .btn {
      display: inline-block;
      background: var(--green);
      color: white;
      border: 1px solid var(--green);
      border-radius: 5px;
      padding: 11px 16px;
      font-size: 12px;
      font-weight: 600
    }

    .btn.light {
      background: var(--lime);
      color: var(--ink);
      border-color: var(--lime)
    }

    .btn.outline {
      background: transparent;
      color: var(--green);
      border-color: var(--line)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 36px
    }

    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 21px
    }

    .stat small {
      color: var(--muted);
      font-size: 11px
    }

    .stat strong {
      display: block;
      font: 34px var(--serif);
      margin: 13px 0 7px
    }

    .stat span {
      font-size: 10px;
      color: var(--muted)
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 30px 0 20px
    }

    .section-head a {
      font-size: 11px;
      border-bottom: 1px solid var(--muted);
      padding-bottom: 4px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 19px
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .card-body {
      padding: 23px;
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .card p {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 22px
    }

    .card .eyebrow {
      font-size: 9px;
      letter-spacing: 1.3px;
      margin-bottom: 12px
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 11px
    }

    .course-art {
      height: 105px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 23px;
      background: #e4e9dd;
      overflow: hidden
    }

    .course-art b {
      font: 54px var(--serif);
      font-weight: 400;
      opacity: .55
    }

    .course-art span {
      font-size: 10px;
      letter-spacing: 2px
    }

    .course-art.gold {
      background: #eee5d3
    }

    .course-art.blue {
      background: #e0e8eb
    }

    .course-art.rose {
      background: #eee0d9
    }

    .meta {
      display: flex;
      gap: 15px;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 19px
    }

    .progress {
      height: 5px;
      background: #e8ece5;
      border-radius: 5px;
      overflow: hidden;
      margin: 12px 0
    }

    .progress div {
      height: 100%;
      background: var(--green)
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 22px 0
    }

    .filter {
      border: 1px solid var(--line);
      border-radius: 25px;
      background: transparent;
      color: var(--muted);
      padding: 9px 15px;
      font-size: 12px
    }

    .filter.active {
      background: var(--green);
      color: white;
      border-color: var(--green)
    }

    .detail {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 27px
    }

    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 20px
    }

    .week {
      display: flex;
      gap: 16px;
      padding: 22px 0;
      border-bottom: 1px solid var(--line)
    }

    .week:last-child {
      border-bottom: 0
    }

    .week input,
    .final-check input {
      width: 19px;
      height: 19px;
      accent-color: var(--green);
      flex-shrink: 0;
      margin: 3px 0
    }

    .week label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer
    }

    .week small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 7px;
      letter-spacing: 1px
    }

    .week p {
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0 0
    }

    .week.done label {
      text-decoration: line-through;
      color: var(--muted)
    }

    .final-check {
      display: flex;
      gap: 14px;
      background: #edf2e3;
      border: 1px solid #cdd9bc;
      border-radius: 6px;
      padding: 20px;
      margin-top: 20px
    }

    .final-check strong {
      font-size: 13px
    }

    .final-check p {
      font-size: 12px;
      color: var(--muted);
      margin: 7px 0 0
    }

    .back {
      display: inline-block;
      font-size: 12px;
      margin-bottom: 25px;
      color: var(--muted)
    }

    .aside-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px
    }

    .aside-row span {
      color: var(--muted)
    }

    .empty {
      text-align: center;
      padding: 75px 25px;
      background: white;
      border: 1px dashed #bdc9b8;
      border-radius: 10px
    }

    .empty .symbol {
      font: 48px var(--serif);
      color: #819675;
      margin-bottom: 24px
    }

    .empty p {
      color: var(--muted);
      font-size: 13px
    }

    .profile-head {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 30px
    }

    .profile-head .avatar {
      width: 70px;
      height: 70px;
      font: 30px var(--serif)
    }

    .notice {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-top: 1px solid var(--line);
      margin-top: 45px;
      padding-top: 20px;
      color: var(--muted);
      font-size: 10px
    }

    #toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--ink);
      color: white;
      padding: 16px 22px;
      border-radius: 7px;
      max-width: 350px;
      z-index: 10;
      box-shadow: 0 8px 30px #0002
    }

    #toast:empty {
      display: none
    }

    @media(min-width:1450px) {
      .content {
        padding-top: 50px
      }

      .hero {
        padding: 42px
      }
    }

    @media(max-width:1100px) {
      .layout {
        grid-template-columns: 200px 1fr
      }

      .sidebar {
        padding: 28px 15px
      }

      .content {
        padding: 30px 26px
      }

      .topbar {
        padding: 0 26px
      }

      .grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .detail {
        grid-template-columns: 1fr
      }

      .stats {
        gap: 10px
      }

      .stat {
        padding: 16px
      }

      .hero-art:after {
        display: none
      }
    }

    @media(max-width:720px) {
      .layout {
        display: block
      }

      .sidebar {
        position: relative;
        height: auto;
        padding: 18px
      }

      .brand {
        margin-bottom: 16px
      }

      .nav-label,
      .side-bottom {
        display: none
      }

      nav {
        display: flex;
        overflow: auto;
        margin: 0;
        gap: 4px
      }

      nav a {
        white-space: nowrap;
        padding: 10px;
        font-size: 11px
      }

      .nav-icon {
        display: none
      }

      .topbar {
        height: 60px;
        padding: 0 20px
      }

      .content {
        padding: 27px 20px
      }

      .heading {
        align-items: start
      }

      h1 {
        font-size: 34px
      }

      .heading>.pill {
        display: none
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 27px
      }

      .hero h2 {
        font-size: 30px
      }

      .hero-art {
        display: none
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        margin-bottom: 28px
      }

      .grid {
        grid-template-columns: 1fr
      }

      .section-head h2 {
        font-size: 23px
      }

      footer {
        line-height: 1.7
      }

      .panel {
        padding: 20px
      }
    }
  </style>
  <style>
    .role-switch {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .role-badge {
      font-size: 10px !important;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--green) !important
    }

    .admin-panel {
      border-left: 4px solid #a58235
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .form-grid .full {
      grid-column: 1/-1
    }

    .field {
      display: grid;
      gap: 7px
    }

    .field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted)
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px;
      color: var(--ink);
      border-radius: 4px
    }

    .field textarea {
      min-height: 110px;
      resize: vertical
    }

    .stack {
      display: grid;
      gap: 18px
    }

    .book-level {
      display: inline-block;
      background: var(--lime);
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px
    }

    .submission {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      margin-top: 20px
    }

    .book-card {
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .book-card .card-footer {
      margin-top: auto
    }

    .notice strong {
      color: var(--ink)
    }

    @media(max-width:720px) {
      .form-grid {
        grid-template-columns: 1fr
      }

      .form-grid .full {
        grid-column: auto
      }

      .role-switch span:not(.role-badge) {
        display: none
      }
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px
    }

    .admin-actions .btn {
      margin: 0
    }

    .syllabus-editor {
      display: grid;
      gap: 18px
    }

    .syllabus-week {
      border: 1px solid var(--line);
      padding: 20px;
      background: #fbfcf8
    }

    .syllabus-week h3 {
      margin: 0 0 18px;
      font: 22px var(--serif)
    }

    .resource-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px
    }

    .resource-row .btn {
      margin: 0
    }

    .syllabus-resource {
      margin: 8px 0 0;
      font-size: 12px
    }

    .additional-resources {
      margin-top: 20px
    }
  </style>
  <style>
    .syllabus-summary {
      padding: 12px 15px;
      background: #edf2e3;
      border: 1px solid #cdd9bc;
      border-radius: 6px;
      color: var(--ink);
      font-size: 12px
    }

    .syllabus-summary.invalid {
      background: #fff2ed;
      border-color: #dfb7a5
    }

    .syllabus-week .section-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px
    }

    .student-syllabus .week {
      display: block
    }

    .student-syllabus .week small {
      margin-bottom: 8px
    }

    .student-syllabus .week a {
      font-size: 12px;
      color: var(--green);
      text-decoration: underline
    }

    .completed-book {
      border-color: var(--green);
      background: #eef5e4
    }

    .completed-book .book-level {
      background: var(--green);
      color: white
    }

    .stat-link {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--ink);
      font: 34px var(--serif);
      cursor: pointer
    }
  </style>
  <style>
    .graduation-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 19px
    }

    .graduation-card {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .graduation-card h3 {
      margin: 0
    }

    .requirement-box {
      background: #fbfcf8;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 15px;
      font-size: 12px
    }

    .requirement-box strong {
      display: block;
      font: 22px var(--serif);
      margin-top: 5px
    }

    .graduation-editor {
      display: grid;
      gap: 12px
    }

    .graduation-editor .field {
      gap: 5px;
      background: #fbfcf8;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px
    }

    .graduation-editor .field label {
      font-size: 9px
    }

    .graduation-editor input {
      padding: 9px
    }

    .graduation-card .admin-actions {
      margin-top: auto
    }

    @media(max-width:1100px) {
      .graduation-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(max-width:720px) {
      .graduation-grid {
        grid-template-columns: 1fr
      }
    }
  </style>
  <style>
    .commitment-list {
      display: grid;
      gap: 14px;
      margin-top: 18px
    }

    .commitment-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      background: #fbfcf8
    }

    .commitment-card.completed {
      border-color: var(--green);
      background: #eef5e4
    }

    .commitment-card h3 {
      font-size: 18px;
      margin: 0 0 8px
    }

    .commitment-meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px
    }

    .commitment-form-row {
      display: grid;
      grid-template-columns: 1.2fr .7fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px
    }

    .deadline-list {
      display: grid;
      gap: 10px
    }

    .deadline-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line)
    }

    .deadline-item:last-child {
      border-bottom: 0
    }

    .deadline-item strong {
      display: block
    }

      app.innerHTML = '<section class="panel auth-card"><div class="eyebrow">Openfield University</div><h1>Welcome back</h1><p class="sub">Sign in to continue your learning journey.</p><form data-form="auth-login" class="form-grid"><div class="field full"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field full"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><div class="full"><button class="btn" type="submit">Sign in</button></div></form><p class="auth-switch">New to Openfield? <button type="button" data-auth-mode="signup">Create an account</button></p><p class="auth-message" role="alert">' + authEscape(message) + '</p></section>';
    }
    function renderSignupScreen(message = '') {
      document.body.classList.add('auth-required');
      app.innerHTML = '<section class="panel auth-card"><div class="eyebrow">Openfield University</div><h1>Create your account</h1><p class="sub">New accounts are student accounts.</p><form data-form="auth-signup" class="form-grid"><div class="field full"><label>Display name</label><input name="displayName" autocomplete="name" required></div><div class="field full"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field full"><label>Password</label><input name="password" type="password" autocomplete="new-password" minlength="6" required></div><div class="full"><button class="btn" type="submit">Create account</button></div></form><p class="auth-switch">Already have an account? <button type="button" data-auth-mode="login">Sign in</button></p><p class="auth-message" role="alert">' + authEscape(message) + '</p></section>';
    }
    async function loadOrCreateProfile(user) {
      const { data: existing, error: readError } = await openfieldSupabase.from('profiles').select('id,display_name,role,current_academic_year').eq('id', user.id).maybeSingle();
      if (existing) return existing;
      if (readError && readError.code !== 'PGRST116') throw readError;
      const displayName = String(user.user_metadata?.display_name || user.email?.split('@')[0] || 'Openfield learner').slice(0, 120);
      const { data: created, error: createError } = await openfieldSupabase.from('profiles').insert({ id: user.id, display_name: displayName, role: 'student', current_academic_year: 1 }).select('id,display_name,role,current_academic_year').single();
      if (createError) throw createError;
      return created;
    }
    function applyAuthenticatedProfile(user, profile) {
      authState.user = user; authState.profile = profile; authState.ready = true;
      authState.adminUnlocked = profile.role === 'admin';
      authState.viewRole = 'student';
      state.role = 'student';
      state.currentYear = Number(profile.current_academic_year || 1);
      document.body.classList.remove('auth-required');
      document.getElementById('account-name').textContent = profile.display_name || user.email || 'My account';
      document.getElementById('account-avatar').textContent = (profile.display_name || user.email || 'L').trim().charAt(0).toUpperCase();
      document.getElementById('logout-button').hidden = false;
      syncAdminViewControl();
      persist(); render();
    }
    function syncAdminViewControl() {
      const toggle = document.getElementById('role-toggle');
      if (!toggle) return;
      toggle.hidden = !authState.adminUnlocked;
      toggle.textContent = state.role === 'admin' ? 'Student View' : 'Administrator View';
      document.getElementById('role-label').textContent = state.role === 'admin' ? 'Administrator view' : 'Student view';
    }
    async function verifyAdminPasscode(passcode) {
      const { data, error } = await openfieldSupabase.rpc(
        'unlock_admin_access',
        { passcode }
      );
      if (error) {
        console.error(
          '[Admin Access] Admin passcode verification failed:',
          error
        );
        return {
          verified: false,
          message: 'Could not verify admin passcode.'
        };
      }
      return {
        verified: data === true,
        message: data === true
          ? 'Admin access granted.'
          : 'Incorrect admin passcode.'
      };
    }
    function adminAccessSection() {
      if (!authState.user || authState.adminUnlocked) return '';
      return '<section class="panel"><div class="eyebrow">Account security</div><h2>Admin Access</h2><p class="sub">Enter an administrator passcode to request administrator access.</p><form data-form="admin-passcode" class="form-grid" style="margin-top:18px"><div class="field full"><label>Admin passcode</label><input name="passcode" type="password" autocomplete="off" required></div><div class="full"><button class="btn outline" type="submit">Unlock Admin Access</button></div><p class="auth-message full" data-admin-access-status role="status"></p></form></section>';
    }
    async function restoreSupabaseSession() {
      if (!openfieldSupabase) { renderAuthScreen('Authentication service is unavailable.'); return; }
      authState.ready = false;
      const { data: { session }, error } = await openfieldSupabase.auth.getSession();
      if (error) { console.error('[Supabase Auth] Unable to restore session:', error); renderAuthScreen('We could not restore your session. Please sign in again.'); return; }
      if (!session?.user) { authState.ready = true; renderAuthScreen(); return; }
      try { applyAuthenticatedProfile(session.user, await loadOrCreateProfile(session.user)); }
      catch (profileError) { console.error('[Supabase Auth] Unable to load profile:', profileError); authState.ready = true; renderAuthScreen('Your account is signed in, but its profile could not be loaded. Please contact an administrator.'); }
    }
    app.addEventListener('click', e => { const mode = e.target.closest('[data-auth-mode]'); if (mode) { e.preventDefault(); mode.dataset.authMode === 'signup' ? renderSignupScreen() : renderAuthScreen(); } });
    app.addEventListener('submit', async e => { const form = e.target; if (form.dataset.form === 'admin-passcode') { e.preventDefault(); const status = form.querySelector('[data-admin-access-status]'), button = form.querySelector('button'); button.disabled = true; status.textContent = 'Verifying access…'; try { const result = await verifyAdminPasscode(String(new FormData(form).get('passcode') || ''));if(result.verified){authState.adminUnlocked = true;authState.viewRole = 'admin';state.role = 'admin'; syncAdminViewControl(); render();} status.textContent = result.verified ? 'Administrator access unlocked.' : (result.message || 'Administrator access could not be verified.'); } catch (error) { console.error('[Supabase Auth] Admin access verification failed:', error); status.textContent = 'Administrator access could not be verified.'; } finally { form.elements.passcode.value = ''; button.disabled = false; } return } if (!['auth-login', 'auth-signup'].includes(form.dataset.form)) return; e.preventDefault(); const button = form.querySelector('button[type="submit"]'), data = new FormData(form), email = String(data.get('email') || '').trim(), password = String(data.get('password') || ''); button.disabled = true; try { if (form.dataset.form === 'auth-login') { const { error } = await openfieldSupabase.auth.signInWithPassword({ email, password }); if (error) throw error; await restoreSupabaseSession(); } else { const displayName = String(data.get('displayName') || '').trim(), { data: result, error } = await openfieldSupabase.auth.signUp({ email, password, options: { data: { display_name: displayName } } }); if (error) throw error; if (result.session?.user) { applyAuthenticatedProfile(result.session.user, await loadOrCreateProfile(result.session.user)); } else renderAuthScreen('Account created. Check your email to confirm it, then sign in.'); } } catch (error) { console.error('[Supabase Auth] Authentication failed:', error); const message = error?.message || 'Authentication failed. Please try again.'; form.querySelector('.auth-message').textContent = message; } finally { button.disabled = false; } });
    document.addEventListener('click', async e => { const logout = e.target.closest('#logout-button'); const roleToggle = e.target.closest('#role-toggle'); if (roleToggle) { e.preventDefault(); e.stopImmediatePropagation(); console.log('ROLE BUTTON CLICKED'); console.log('adminUnlocked: ', authState.adminUnlocked); console.log('current role:', state.role); if (!authState.user || !authState.adminUnlocked) return; state.role = state.role === 'admin' ? 'student' : 'admin'; console.log('new role:', state.role); syncAdminViewControl(); render(); return; } if (!logout) return; e.preventDefault(); const { error } = await openfieldSupabase.auth.signOut(); if (error) { console.error('[Supabase Auth] Sign out failed:', error); toast('Could not sign out. Please try again.'); return; } authState.user = null; authState.profile = null; authState.adminUnlocked = false; authState.viewRole = null; authState.ready = true; document.getElementById('logout-button').hidden = true; document.getElementById('role-toggle').hidden = true; location.hash = 'home'; renderAuthScreen(); }, { capture: true });
    const renderBeforeAuth = render; render = function () { if (!authState.ready || !authState.user) { renderAuthScreen(); return } renderBeforeAuth() };
    if (openfieldSupabase) { openfieldSupabase.auth.onAuthStateChange((event, session) => { setTimeout(() => { if (event === 'SIGNED_OUT') { authState.user = null; authState.profile = null; authState.adminUnlocked = false; authState.viewRole = null; authState.ready = true; document.getElementById('logout-button').hidden = true; document.getElementById('role-toggle').hidden = true; renderAuthScreen(); } else if (session?.user) restoreSupabaseSession(); }, 0); }); }
    const profileBeforeAdminAccess = profile; profile = function () { return profileBeforeAdminAccess() + adminAccessSection() };
    restoreSupabaseSession();
  </script>
</body>

</html>
